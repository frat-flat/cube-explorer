<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>キューブ組み立て 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 左にキューブの木(上位・下位)、中央に軸の設定、右にプレビュー。狭い画面では縦に積む */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --sunk: #e9edef;
  --ink: #1b2428;
  --muted: #5d6b71;
  --line: #d5dde0;
  --accent: #0e6a70;
  --accent-soft: #d9eeef;
  --on-accent: #ffffff;
  --warn: #9a4b0c;
  --warn-soft: #fbead9;
  --ax-x: #7b4bb3;
  --ax-y: #2f8a4c;
  --ax-z: #c2407a;
  --ax-x-soft: #efe7f8;
  --ax-y-soft: #e2f3e7;
  --ax-z-soft: #fae6ef;
  --stage: #eef2f3;
  --font-display: "Zen Kaku Gothic New", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121719; --surface: #1a2124; --sunk: #232c30; --ink: #e3eaec; --muted: #9aa9ae; --line: #33403f;
    --accent: #5cc3c9; --accent-soft: #1d3a3c; --on-accent: #0b1a1b; --warn: #f0a868; --warn-soft: #3a2a1b;
    --ax-x: #b48be6; --ax-y: #6fcf8d; --ax-z: #ef7fb0; --ax-x-soft: #2c2338; --ax-y-soft: #1d3125; --ax-z-soft: #3a2230; --stage: #161d20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121719; --surface: #1a2124; --sunk: #232c30; --ink: #e3eaec; --muted: #9aa9ae; --line: #33403f;
  --accent: #5cc3c9; --accent-soft: #1d3a3c; --on-accent: #0b1a1b; --warn: #f0a868; --warn-soft: #3a2a1b;
  --ax-x: #b48be6; --ax-y: #6fcf8d; --ax-z: #ef7fb0; --ax-x-soft: #2c2338; --ax-y-soft: #1d3125; --ax-z-soft: #3a2230; --stage: #161d20;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; padding-inline: 0; padding-block: 0; }
/* 左のサイドバー(画面の切り替えとキューブの木)+右の画面 */
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 12px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { font-family: var(--font-display); font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.brand .ico { width: 13px; height: 13px; background: var(--accent); transform: rotate(45deg) scale(.85); border-radius: 2px; }
.menu-btn { display: none; margin-left: auto; }
.nav { display: grid; gap: 2px; }
.nav button { border: 0; text-align: left; background: transparent; padding: 7px 10px; border-radius: 6px; display: flex; align-items: center; gap: 8px; }
.nav button:hover { background: var(--sunk); }
.nav button[aria-current="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.nav .n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--sunk); color: var(--ink); font-size: 11px; font-family: var(--font-mono); }
.nav button[aria-current="true"] .n { background: var(--on-accent); color: var(--accent); }
.nav-sub { font-size: 11px; letter-spacing: .08em; color: var(--muted); margin: 14px 4px 4px; }
.side-foot { display: grid; gap: 6px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.main { min-width: 0; padding-inline: 20px; padding-block: 18px 40px; display: grid; gap: 12px; align-content: start; }
.views { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.views.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .views.split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-inline: 16px; }
  .menu-btn { display: inline-block; }
  .brand { margin-bottom: 0; }
  .side:not(.open) .side-body { display: none; }
  .side.open .brand { margin-bottom: 10px; }
  .main { padding-inline: 16px; }
}
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.lead { margin: 2px 0 0; color: var(--muted); max-width: 72ch; }
.tag { display: inline-block; font-size: 11px; letter-spacing: .06em; padding: 1px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); vertical-align: 3px; margin-left: 6px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 2px 6px; }
button.ghost:hover { color: var(--ink); }
.danger { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.panel-title { font-size: 12px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }

.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.notice { padding: 8px 10px; border-radius: 6px; background: var(--accent-soft); font-size: 13px; margin: 8px 0 0; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.empty { color: var(--muted); padding: 14px; text-align: center; }

/* キューブの木 */
.tree { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tree button { width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; display: flex; gap: 8px; align-items: center; }
.tree button:hover { background: var(--sunk); }
.tree button[aria-current="true"] { background: var(--accent-soft); font-weight: 700; }
.tree .ico { flex: none; width: 11px; height: 11px; background: var(--accent); transform: rotate(45deg) scale(.85); border-radius: 1px; }
.tree .via { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 400; white-space: nowrap; }
.tree-actions { display: grid; gap: 6px; margin-top: 10px; }
.tpls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
.tpl { text-align: left; display: grid; gap: 2px; padding: 10px 12px; }
.tpl span { font-size: 12px; color: var(--muted); }

/* 設定(中央) */
.crumbs { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.crumbs button { padding: 0 4px; border: 0; background: none; color: var(--accent); text-decoration: underline; }
h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 12px; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 7px 12px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.row { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px 10px; align-items: center; margin-bottom: 8px; }
.row > label { font-size: 13px; color: var(--muted); }
.axis-card { border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; border-left: 4px solid var(--c); background: var(--c-soft); }
.axis-card.x { --c: var(--ax-x); --c-soft: var(--ax-x-soft); }
.axis-card.y { --c: var(--ax-y); --c-soft: var(--ax-y-soft); }
.axis-card.z { --c: var(--ax-z); --c-soft: var(--ax-z-soft); }
.axis-card.v { --c: var(--accent); --c-soft: var(--accent-soft); }
.axis-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.axis-head .badge { font-family: var(--font-mono); font-weight: 500; color: var(--c); font-size: 13px; }
.axis-head input { flex: 1 1 140px; font-weight: 700; }
.axis-head .dir { font-size: 12px; color: var(--muted); }
.members { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.member { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; padding: 1px 2px 1px 8px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.member button { border: 0; background: none; padding: 0 5px; color: var(--muted); line-height: 1.3; }
.member .down { color: var(--accent); font-size: 11px; }
.add-member { display: flex; gap: 6px; flex-wrap: wrap; }
.add-member input { flex: 1 1 140px; }
.link-note { font-size: 12px; margin-top: 4px; color: var(--c); }
.month-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* データ入力 */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; white-space: nowrap; }
th { font-size: 12px; font-weight: 400; background: var(--sunk); }
th.hx { color: var(--ax-x); }
th.hy { color: var(--ax-y); }
td input { width: 100%; min-width: 80px; border-color: transparent; background: transparent; padding: 3px 4px; text-align: right; font-family: var(--font-mono); }
td input:hover { border-color: var(--line); }
td.v { text-align: right; font-family: var(--font-mono); }
td.v.zero { color: var(--muted); }
tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
.tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin-bottom: 10px; }
.tools label { font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
textarea { width: 100%; min-height: 110px; font-family: var(--font-mono); font-size: 12px; }
.map { display: grid; gap: 6px; margin: 10px 0; }
.map-row { display: grid; grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr); gap: 8px; align-items: center; }
.map-row .src { font-family: var(--font-mono); font-size: 12px; padding: 5px 8px; background: var(--sunk); border-radius: 6px; overflow: hidden; text-overflow: ellipsis; }

/* プレビュー */
.viewer-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
.viewer-head h2 { margin: 0; }
.viewer-body { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.views.split .viewer-body, .viewer.small .viewer-body { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1000px) { .viewer-body { grid-template-columns: minmax(0, 1fr); } }
.views.split .viewer { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.stage { position: relative; height: min(68vh, 640px); min-height: 320px; border-radius: 8px; background: var(--stage); overflow: hidden; user-select: none; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; transform: translate(-50%, -50%); font-size: 11px; white-space: nowrap; padding: 0 4px; border-radius: 3px; background: color-mix(in srgb, var(--surface) 85%, transparent); }
.lbl.x { color: var(--ax-x); } .lbl.y { color: var(--ax-y); } .lbl.z { color: var(--ax-z); }
.lbl.title { font-weight: 700; font-size: 12px; border: 1px solid currentColor; }
.snap { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; align-items: center; }
.snap button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.snap .sp { margin-left: auto; font-size: 12px; color: var(--muted); }
.cellinfo { min-height: 46px; font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--sunk); margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.cellinfo .k { color: var(--muted); font-size: 12px; }
.cellinfo .x { color: var(--ax-x); } .cellinfo .y { color: var(--ax-y); } .cellinfo .z { color: var(--ax-z); }
.cellinfo b { font-family: var(--font-mono); }
.face-title { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
.face-title .x { color: var(--ax-x); } .face-title .y { color: var(--ax-y); } .face-title .z { color: var(--ax-z); }
.notes { margin-top: 8px; padding-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--c) 40%, transparent); }
.notes summary { cursor: pointer; font-size: 13px; color: var(--c); display: flex; gap: 8px; align-items: baseline; }
.note-names { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.note-name { display: inline-flex; align-items: center; gap: 2px; }
.note-name input { width: 8.5em; padding: 3px 6px; font-size: 13px; }
.show-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; margin: 4px 0; }
.show-row > span:first-child { color: var(--muted); font-size: 12px; }
.show-row .x { color: var(--ax-x); } .show-row .y { color: var(--ax-y); } .show-row .z { color: var(--ax-z); }
.chk { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.note-table td input { text-align: left; font-family: var(--font-body); min-width: 150px; }
.note-table td:first-child { font-size: 13px; }
.sub { font-size: 13px; color: var(--c); margin: 8px 0 4px; }
.compose { display: grid; gap: 6px; }
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.part { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.pnum { font-family: var(--font-mono); font-size: 11px; color: var(--muted); width: 1.2em; text-align: right; }
.palts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; flex: 1 1 200px; min-width: 0; }
.pill { display: inline-flex; align-items: center; font-size: 13px; padding: 1px 2px 1px 8px; border-radius: 99px; background: var(--sunk); }
.pill button { padding: 0 5px; }
.or { font-size: 11px; color: var(--muted); padding: 0 2px; }
.part select { font-size: 12px; padding: 2px 4px; }
.pmove { display: flex; gap: 0; margin-left: auto; }
.compose-foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
.notes-bar details + details { margin-top: 4px; border-top: 1px solid var(--line); padding-top: 4px; }
.notes-bar summary { cursor: pointer; font-size: 13px; }
.notes-bar summary .x { color: var(--ax-x); } .notes-bar summary .y { color: var(--ax-y); } .notes-bar summary .z { color: var(--ax-z); }
.notes-bar .compose { margin-top: 6px; }
.bulk { margin-top: 8px; padding: 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.sheet-wrap { max-height: 460px; overflow: auto; }
.sheet { width: auto; min-width: 100%; }
.sheet th { position: sticky; top: 0; z-index: 1; padding: 3px; }
.sheet th select { width: 100%; min-width: 88px; font-size: 12px; padding: 3px 4px; font-weight: 700; }
.sheet th.hx select { color: var(--ax-x); } .sheet th.hy select { color: var(--ax-y); } .sheet th.hz select { color: var(--ax-z); } .sheet th.hv select { color: var(--accent); }
.sheet td { padding: 0; border-right: 1px solid var(--line); }
.sheet td input { min-width: 88px; width: 100%; text-align: left; font-family: var(--font-body); border-radius: 0; padding: 5px 6px; }
.sheet td input:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--surface); }
.sheet .rn { width: 1%; color: var(--muted); font-size: 11px; text-align: right; padding: 0 6px; background: var(--sunk); }
.tools label input[type=file] { font-size: 12px; }
.guide { list-style: none; counter-reset: g; display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; padding: 0; font-size: 12px; }
.guide li { counter-increment: g; padding: 2px 10px 2px 6px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.guide li::before { content: counter(g); display: inline-block; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 50%; margin-right: 4px; background: var(--line); color: var(--ink); font-size: 11px; }
.guide li.now { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.guide li.now::before { background: var(--on-accent); color: var(--accent); }
.guide-box { font-size: 13px; padding: 8px 12px; border-radius: 6px; background: var(--accent-soft); margin: 0 0 10px; }
.axis-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.axis-pick button { font-weight: 700; }
.axis-pick button.x { color: var(--ax-x); } .axis-pick button.y { color: var(--ax-y); } .axis-pick button.z { color: var(--ax-z); }
.axis-pick button span { font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 4px; }
.axis-pick button[aria-pressed="true"] { border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; background: var(--surface); }
.msheet { table-layout: fixed; width: 100%; }
.msheet col.c-rn { width: 40px; } .msheet col.c-add { width: 110px; }
.msheet th { vertical-align: middle; padding: 6px; height: 44px; }
.msheet .mh { display: flex; align-items: center; gap: 4px; min-width: 0; }
.msheet .mh input { flex: 1 1 auto; min-width: 0; width: 100%; font-weight: 700; font-size: 12px; padding: 4px 6px; }
.msheet .mh .tagb { flex: none; font-size: 10px; padding: 1px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.msheet .mh button { flex: none; padding: 0 6px; }
.msheet td input { min-width: 0; }
.msheet th.add { text-align: center; }
.msheet.hz col.c-lab { width: 220px; }
.msheet.virt tbody tr:not(.spacer) { height: 35px; }
.msheet.virt tbody tr.spacer td { padding: 0; border: 0; background: transparent; }
.msheet.hz thead th { text-align: center; font-size: 11px; height: 32px; }
.msheet.hz thead th button { padding: 0 4px; }
.msheet.hz tbody th { background: var(--sunk); position: sticky; left: 0; z-index: 1; }
.msheet td.draft input { background: color-mix(in srgb, var(--sunk) 50%, transparent); }
.sheet-wrap.tall { max-height: 70vh; }
.mtools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.mtools .axis-pick { margin-bottom: 0; }
.seg { display: inline-flex; align-items: center; gap: 0; font-size: 12px; }
.seg > span { color: var(--muted); margin-right: 8px; }
.seg button { border-radius: 0; font-size: 12px; padding: 4px 10px; }
.seg button:first-of-type { border-radius: 6px 0 0 6px; } .seg button:last-of-type { border-radius: 0 6px 6px 0; border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); } .msheet td.rn { text-align: center; }
.msheet.x th input { color: var(--ax-x); } .msheet.y th input { color: var(--ax-y); } .msheet.z th input { color: var(--ax-z); }
.msheet th.rn button { font-size: 12px; white-space: nowrap; padding: 3px 8px; }
.sheet thead th { white-space: nowrap; }
.sheet th.hx, .sheet th.hy, .sheet th.hz { font-size: 12px; padding: 4px 8px; }
.sheet th.hz { color: var(--ax-z); }
.sheet .corner { font-size: 11px; }
.sheet .corner .hx { color: var(--ax-x); } .sheet .corner .hy { color: var(--ax-y); } .sheet .corner .hz { color: var(--ax-z); }
.sheet td input.num { text-align: right; font-family: var(--font-mono); }
.sheet-tabs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 6px; font-size: 12px; }
.sheet-tabs > span { font-weight: 700; margin-right: 4px; } .sheet-tabs .x { color: var(--ax-x); } .sheet-tabs .y { color: var(--ax-y); } .sheet-tabs .z { color: var(--ax-z); }
.sheet-tabs button { font-size: 12px; padding: 3px 10px; color: var(--ink); }
.sheet-tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
details.long { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
details.long summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.views.split .stage { height: 380px; min-height: 0; }
/* ダッシュボード */
.dash { display: grid; gap: 16px; }
.dash-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.dash-head h1 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
@media (max-width: 420px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h3 { font-family: var(--font-display); font-size: 16px; margin: 0; }
.card .crumb { font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--sunk); }
.chip.x { color: var(--ax-x); background: var(--ax-x-soft); } .chip.y { color: var(--ax-y); background: var(--ax-y-soft); } .chip.z { color: var(--ax-z); background: var(--ax-z-soft); }
.meter { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.bars { display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; }
.bar .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.bar .tr { height: 10px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar .tr i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar .nv { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.card-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.lowers { font-size: 12px; color: var(--muted); }
.lowers button { border: 0; background: none; padding: 0 2px; color: var(--accent); text-decoration: underline; font-size: 12px; }
.dash-empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.notes-bar { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
@media (prefers-reduced-motion: no-preference) { .tree button, .tabs button { transition: background .12s; } }
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i class="ico"></i>Cube Explorer<span class="tag">試作</span>
      <button type="button" class="ghost menu-btn" id="menu-btn" aria-expanded="false" aria-controls="side-body">メニュー</button></div>
    <div class="side-body" id="side-body">
      <nav class="nav" id="nav" aria-label="画面">
        <button type="button" data-view="dash">ダッシュボード</button>
        <button type="button" data-view="cube">キューブを見る</button>
        <p class="nav-sub">組み立てと入力</p>
        <button type="button" data-view="axes"><span class="n">1</span>軸を決める</button>
        <button type="button" data-view="members"><span class="n">2</span>目盛りを登録</button>
        <button type="button" data-view="data"><span class="n">3</span>値を入れる</button>
      </nav>
      <p class="nav-sub">キューブ(上位 › 下位)</p>
      <ul class="tree" id="tree"></ul>
      <div class="tree-actions">

  <main class="main">

    <div class="views" id="views">

      <section class="panel" id="editor" hidden></section>
      <section class="panel viewer" id="viewer">
        <div class="viewer-head"><h2 id="viewer-title">プレビュー</h2><span class="hint" id="viewer-sub" style="margin:0"></span></div>
        <div class="viewer-body">
          <div class="viewer-3d">

            <div class="snap" id="snap">
              <button type="button" data-face="front" aria-pressed="false">正面</button>
              <button type="button" data-face="top" aria-pressed="false">上面</button>
              <button type="button" data-face="side" aria-pressed="false">側面</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const nid = (p) => p + Math.random().toString(36).slice(2, 9);
  const AX = ["x", "y", "z"];
  const AXNAME = { x: "X軸", y: "Y軸", z: "Z軸" };
  const AXDIR = { x: "横に並ぶ", y: "縦に並ぶ", z: "奥に並ぶ" };
  const VTYPE = { money: "金額", number: "数値", text: "文字" };
  const AGG = { sum: "合計", avg: "平均", count: "件数", max: "最大", min: "最小" };
  const SEP = "\u0001";
  const fmt = (n) => (Number.isFinite(n) ? (Math.round(n * 100) / 100).toLocaleString("ja-JP") : "");

  // ---- キューブの形 ----
  // cube = { id, name, parent, via: "x"|"y"|"z"(上位のどの軸の目盛りから入るか), axes: {x,y,z}, value: {name,type,agg}, cells: { "上位の目盛り\u0001x\u0001y\u0001z": 値 } }
  // axis = { name, kind: "list"|"month", members: [...], from, to }
  const newAxis = (name, members = []) => ({ name, kind: "list", members, from: "", to: "" });
  const newCube = (name, parent = null, via = null) => ({ id: nid("c"), name, parent, via, axes: { x: newAxis("X軸"), y: newAxis("Y軸"), z: newAxis("Z軸") }, value: { name: "値", type: "number", agg: "sum" }, cells: {} });
  const monthsBetween = (a, b) => {
    if (!/^\d{4}-\d{2}$/.test(a) || !/^\d{4}-\d{2}$/.test(b) || a > b) return [];
    const out = []; let [y, m] = a.split("-").map(Number);
    while (out.length < 60) { const s = `${y}-${String(m).padStart(2, "0")}`; out.push(s); if (s === b) break; m++; if (m > 12) { m = 1; y++; } }
    return out;
  };
  const members = (ax) => (ax.kind === "month" ? monthsBetween(ax.from, ax.to) : ax.members);
  // 表記:目盛りごとに複数の書き方(法人名・PartyID・顧客番号など)を持てる。
  // labels[0](id "base")が基本の表記で、目盛りそのもの。ほかの表記の値は alt[目盛り][表記の id] に持つ。
  // show は表示の並び。1つの部品は表記の id の配列で、2つ以上なら「または」(値の入っている最初の表記を使う)。
  //   例 [["base"], ["n2", "n3"], ["n4"]] … 顧客番号 / 法人名または屋号 / 代表者名
  // pack が true(既定)なら、値の入っていない部品は飛ばして詰める。false なら「—」を出す
  const ensureLabels = (ax) => { if (!ax.labels?.length) ax.labels = [{ id: "base", name: "名前" }]; ax.alt ??= {}; ax.show = partsOf(ax); return ax; };
  const partsOf = (ax) => { const ids = new Set((ax.labels || []).map((l) => l.id)); const ps = (ax.show || ["base"]).map((p) => (Array.isArray(p) ? p : [p]).filter((id) => ids.has(id))).filter((p) => p.length); return ps.length ? ps : [["base"]]; };
  const labelName = (ax, id) => ax.labels?.find((l) => l.id === id)?.name ?? "";
  const hasNotes = (ax) => ax.kind === "list" && (ax.labels?.length ?? 0) > 1;
  const noteVal = (ax, m, id) => (id === "base" ? m : ax.alt?.[m]?.[id] ?? "");
  const disp = (ax, m) => {
    if (!hasNotes(ax)) return m;
    const out = [];
    for (const part of partsOf(ax)) {
      const v = part.map((id) => noteVal(ax, m, id)).find((x) => x);
      if (v) out.push(v); else if (ax.pack === false) out.push("—");
    }
    return out.length ? out.join(" / ") : m;
  };
  const withNotes = (ax, labels, alt) => Object.assign(ax, { labels: [{ id: "base", name: labels[0] }, ...labels.slice(1).map((name, i) => ({ id: "n" + (i + 1), name }))], alt, show: [["base"]], pack: true });

  // ---- テンプレート ----
  function depositTemplate() {
    const corp = newCube("取引先別の入金");
    // 法人と個人が混ざる取引先。基本の表記は顧客番号(個人は法人名を持たないため)
    const code = { みどり堂: "C-0001", しおかぜ: "C-0002", もみじ屋: "C-0003", くらしき工房: "C-0004", やまだ雑貨: "C-0005", 小林咲: "C-0006" };
    corp.axes = { x: newAxis("取引先", Object.values(code)), y: { name: "年月", kind: "month", members: [], from: "2026-04", to: "2026-09" }, z: newAxis("内訳", ["売上", "システム利用料"]) };
    corp.value = { name: "金額", type: "money", agg: "sum" };
    withNotes(corp.axes.x, ["顧客番号", "PartyID", "法人名", "屋号", "代表者名", "区分"], {
      "C-0001": { n1: "P-10021", n2: "株式会社みどり堂", n4: "佐藤 健", n5: "法人" },
      "C-0002": { n1: "P-10048", n2: "有限会社しおかぜ", n4: "中村 葵", n5: "法人" },
      "C-0003": { n1: "P-10077", n2: "株式会社もみじ屋", n4: "高橋 誠", n5: "法人" },
      "C-0004": { n1: "P-10103", n2: "合同会社くらしき工房", n4: "山本 光", n5: "法人" },
      "C-0005": { n1: "P-10140", n3: "やまだ雑貨", n4: "山田 太郎", n5: "個人" },
      "C-0006": { n1: "P-10152", n4: "小林 咲", n5: "個人" },
    });
    corp.axes.x.show = [["base"], ["n2", "n3"], ["n4"]]; // 顧客番号 / 法人名または屋号 / 代表者名(空欄は詰める)
    const shop = newCube("ショップ別の入金", corp.id, "x");
    shop.axes = { x: newAxis("ショップ", ["楽天市場店", "Yahoo!店", "自社サイト"]), y: { name: "年月", kind: "month", members: [], from: "2026-04", to: "2026-09" }, z: newAxis("内訳", ["売上", "システム利用料"]) };
    shop.value = { name: "金額", type: "money", agg: "sum" };
    const info = newCube("取引先の基本情報", corp.id, "x");
    info.axes = { x: newAxis("項目", ["課税区分", "住所", "代表者"]), y: newAxis("版", ["現在"]), z: newAxis("確認", ["登録内容"]) };
    info.value = { name: "内容", type: "text", agg: "count" };
    const base = { みどり堂: [2800000, 1200000, 300000], しおかぜ: [640000, 0, 0], もみじ屋: [1900000, 910000, 150000], くらしき工房: [0, 450000, 80000], やまだ雑貨: [380000, 0, 60000], 小林咲: [0, 120000, 0] };
    const months = monthsBetween("2026-04", "2026-09");
    for (const [name, arr] of Object.entries(base)) arr.forEach((b, si) => {
      const c = code[name];
      if (!b) return;
      months.forEach((m, i) => {
        const sales = Math.round((b * (0.9 + 0.04 * i + ((name.length * 7 + si * 5 + i * 3) % 7) / 100)) / 100) * 100;
        const fee = -Math.round((sales * 0.035) / 10) * 10;
        const sname = shop.axes.x.members[si];
        shop.cells[[c, sname, m, "売上"].join(SEP)] = sales;
        shop.cells[[c, sname, m, "システム利用料"].join(SEP)] = fee;
        corp.cells[["", c, m, "売上"].join(SEP)] = (corp.cells[["", c, m, "売上"].join(SEP)] || 0) + sales;
        corp.cells[["", c, m, "システム利用料"].join(SEP)] = (corp.cells[["", c, m, "システム利用料"].join(SEP)] || 0) + fee;
      });
    });
    const infos = { みどり堂: ["課税", "広島市中区1丁目", "佐藤 健"], しおかぜ: ["免税", "呉市2丁目", "中村 葵"], もみじ屋: ["課税", "廿日市市3丁目", "高橋 誠"], くらしき工房: ["免税", "倉敷市4丁目", "山本 光"], やまだ雑貨: ["免税", "尾道市5丁目", "山田 太郎"], 小林咲: ["免税", "三原市6丁目", "小林 咲"] };
    for (const [name, vals] of Object.entries(infos)) vals.forEach((v, i) => { info.cells[[code[name], info.axes.x.members[i], "現在", "登録内容"].join(SEP)] = v; });
    return { cubes: [corp, shop, info], selected: corp.id, tab: "axes", at: {} };
  }
  function storeTemplate() {
    const st = newCube("店舗別の売上");
    st.axes = { x: newAxis("店舗", ["本通店", "呉駅前店", "福山店"]), y: { name: "年月", kind: "month", members: [], from: "2026-07", to: "2026-09" }, z: newAxis("商品カテゴリ", ["飲料", "食品", "日用品"]) };
    st.value = { name: "売上金額", type: "money", agg: "sum" };
    withNotes(st.axes.x, ["店舗名", "店舗コード"], { 本通店: { n1: "S01" }, 呉駅前店: { n1: "S02" }, 福山店: { n1: "S03" } });
    const inner = newCube("担当者別の売上", st.id, "x");
    inner.axes = { x: newAxis("担当者", ["田中", "鈴木", "伊藤"]), y: { name: "年月", kind: "month", members: [], from: "2026-07", to: "2026-09" }, z: newAxis("商品カテゴリ", ["飲料", "食品", "日用品"]) };
    inner.value = { name: "売上金額", type: "money", agg: "sum" };
    return { cubes: [st, inner], selected: st.id, tab: "axes", at: {} };
  }
  const TEMPLATES = [
    { name: "入金管理(架空データ入り)", note: "取引先(法人と個人)× 年月 × 内訳の入金。取引先は顧客番号・法人名・屋号・代表者名の表記つき。下位に「ショップ別の入金」と「取引先の基本情報」。", make: depositTemplate },
    { name: "店舗の売上", note: "店舗 × 年月 × 商品カテゴリ。下位に「担当者別の売上」。データは空。", make: storeTemplate },
    { name: "軸だけのひな形", note: "X・Y・Z に名前だけ入った空のキューブを1つ。", make: () => { const c = newCube("新しいキューブ"); return { cubes: [c], selected: c.id, tab: "axes", at: {} }; } },
  ];

  // ---- 状態 ----
  const KEY = "cube-builder-proto-v2";
  let st;
  try { st = JSON.parse(localStorage.getItem(KEY) || "null"); } catch { st = null; }
  const blank = () => ({ cubes: [], selected: null, tab: "axes", view: "dash", at: {} });
  if (!st || !Array.isArray(st.cubes)) st = blank();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch { /* 保存できなくても動かす */ } };
  let face = "front", picked = null, importState = null, pendingDelete = null;

  const cube = (id) => st.cubes.find((c) => c.id === id);
  const kids = (id) => st.cubes.filter((c) => c.parent === id);
  const chainOf = (c) => { const out = []; while (c) { out.unshift(c); c = cube(c.parent); } return out; };
  // 下位のキューブは、上位の目盛り(st.at[下位の id])ごとに中身を持つ
  const atOf = (c) => (c.parent ? (st.at[c.id] ?? members(cube(c.parent).axes[c.via])[0] ?? "") : "");

  function aggregate(c, at, pick) {
    // pick(x,y,z) が true のコマを集める
    const xs = members(c.axes.x), ys = members(c.axes.y), zs = members(c.axes.z);
    const vals = [];
    for (const x of xs) for (const y of ys) for (const z of zs) {
      if (!pick(x, y, z)) continue;
      const v = c.cells[[at, x, y, z].join(SEP)];
      if (v !== undefined && v !== "") vals.push(v);
    }
    if (c.value.type === "text" || c.value.agg === "count") return vals.length ? (c.value.type === "text" && vals.length === 1 && c.value.agg !== "count" ? vals[0] : vals.length) : null;
    const nums = vals.map(Number).filter(Number.isFinite);
    if (!nums.length) return null;
    return { sum: () => nums.reduce((a, b) => a + b, 0), avg: () => nums.reduce((a, b) => a + b, 0) / nums.length, max: () => Math.max(...nums), min: () => Math.min(...nums) }[c.value.agg]();
  }

  // ---- 木 ----
  function renderTree() {
    const out = [];
    const walk = (parent, depth) => kids(parent).forEach((c) => {
      const p = cube(c.parent);
      out.push(`<li><button type="button" data-id="${c.id}" aria-current="${c.id === st.selected}" style="padding-left:${8 + depth * 16}px"><i class="ico"></i>${esc(c.name)}${p ? `<span class="via">${esc(p.axes[c.via].name)}ごと</span>` : ""}</button></li>`);
      walk(c.id, depth + 1);
    });
    walk(null, 0);
    $("tree").innerHTML = out.join("") || `<li class="empty" style="padding:8px 0">まだキューブがありません</li>`;
    const has = !!cube(st.selected);
    $("add-lower").disabled = !has; $("add-upper").disabled = !has;
    $("tree-hint").textContent = has ? "下位は、選んだキューブの1つの軸の目盛りごとに中身を持つキューブです(例:法人ごとのショップ別)。" : "";
  }

  // ---- 中央:設定 ----
  // 表示の並びの編集(軸の設定とプレビューの両方で使う)。部品ごとに「または」を足せ、上下に並び替えられる
  const partText = (ax, part) => part.map((id) => esc(labelName(ax, id))).join("<span class=\"or\">または</span>");
  const sampleOf = (ax) => { const ms = ax.members; const pick = ms.length > 3 ? [ms[0], ms[1], ms[ms.length - 1]] : ms; return pick.map((m) => esc(disp(ax, m))).join("、"); };
  function composeEditor(ax, k) {
    const ps = partsOf(ax);
    return `<div class="compose" data-compose="${k}">
      <ol class="parts">${ps.map((part, i) => `<li class="part">
        <span class="pnum">${i + 1}</span>
        <span class="palts">${part.map((id, j) => `${j ? `<span class="or">または</span>` : ""}<span class="pill">${esc(labelName(ax, id))}${part.length > 1 ? `<button type="button" class="ghost" data-orx="${i}:${id}" aria-label="${esc(labelName(ax, id))}を外す">×</button>` : ""}</span>`).join("")}
          <select data-or="${i}" aria-label="${i + 1}番目に「または」を足す"><option value="">＋ または</option>${ax.labels.filter((l) => !part.includes(l.id)).map((l) => `<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select></span>

  // 表示の並びの操作(クリックと選択)。どちらの場所からでも同じ処理

  // 目盛りの一括登録:Excel の範囲をコピーして貼る(タブ区切り)。CSV(カンマ区切り)も可
  const bulk = { ax: null, text: "", msg: "" };
  function bulkPanel(ax) {
    const ls = ax.labels?.length ? ax.labels : [{ id: "base", name: "名前" }];

      <p class="hint" style="margin:0 0 6px">Excel で範囲を選んでコピーし、下に貼り付けます。1行が1つの目盛りです。1行目に見出し(${ls.map((l) => esc(l.name)).join("・")})があれば、その名前で列をつなぎます。見出しがないときは、左から表記の並び順(${ls.map((l) => esc(l.name)).join(" → ")})として読みます。知らない見出しの列は、新しい表記として足します。同じ${esc(ls.find((l) => l.id === "base").name)}の行は上書きします。</p>

  function bulkApply(ax) {
    ensureLabels(ax);
    const lines = bulk.text.replace(/^\uFEFF/, "").split(/\r?\n/).filter((l) => l.trim() !== "");
    if (!lines.length) { bulk.msg = `<p class="notice warn">貼り付けた内容がありません。</p>`; return; }
    const tab = lines.some((l) => l.includes("\t"));
    const rows = tab ? lines.map((l) => l.split("\t").map((x) => x.trim())) : parseCsv(lines.join("\n")).map((r) => r.map((x) => x.trim()));
    const n = (s) => s.replace(/\s/g, "");
    // 1行目のどれかが表記の名前と同じなら見出しとみなす
    const isHead = rows[0].some((h) => n(h) === n(ax.name) || ax.labels.some((l) => n(l.name) === n(h)));
    let cols;
    if (isHead) {
      cols = rows[0].map((h) => {
        if (!h) return null;
        const hit = ax.labels.find((l) => n(l.name) === n(h)); if (hit) return hit.id;
        if (n(h) === n(ax.name) && !rows[0].some((x) => n(x) === n(ax.labels.find((l) => l.id === "base").name))) return "base"; // 軸の名前の列は基本の表記として読む
        const id = nid("n"); ax.labels.push({ id, name: h }); return id;

    } else cols = ax.labels.map((l) => l.id).slice(0, rows[0].length);

    let added = 0, updated = 0, skipped = 0;
    for (const r of rows.slice(isHead ? 1 : 0)) {
      const m = r[bi]; if (!m) { skipped++; continue; }
      if (ax.members.includes(m)) updated++; else { ax.members.push(m); added++; }
      cols.forEach((id, i) => { if (id && id !== "base" && r[i]) (ax.alt[m] ??= {})[id] = r[i]; });
    }
    bulk.text = ""; bulk.msg = `<p class="notice">${added}件を足し、${updated}件を更新しました${skipped ? `(${esc(ax.labels.find((l) => l.id === "base").name)}が空の${skipped}行は飛ばしました)` : ""}。</p>`;
  }

    $("cube-name").oninput = (e) => { c.name = e.target.value; renderTree(); save(); renderLabelsOnly(); };

  // 貼り付けた文字を目盛りに直す。基本の表記・ほかの表記・表示中の書き方のどれでも探す

  const guide = () => ""; // 手順はタブの①②③で示す

      ${lowers.map((l) => `<button type="button" data-down="${l.id}" data-m="${esc(d[l.via])}">${esc(disp(c.axes[l.via], d[l.via]))}の「${esc(l.name)}」へ</button>`).join("")}`;
  }
  $("cellinfo").onclick = (e) => { const b = e.target.closest("[data-down]"); if (!b) return; st.at[b.dataset.down] = b.dataset.m; st.selected = b.dataset.down; render(); };

  function renderFace() {
    const c = cube(st.selected);
    if (!c || !dims.xs || !dims.xs.length || !dims.ys.length || !dims.zs.length) { $("face").innerHTML = `<p class="empty">${c ? "3つの軸に目盛りを入れると、ここに面の表が出ます。" : "キューブを作ると、ここに立体と表が出ます。"}</p>`; $("face-title").textContent = ""; labelsEl.innerHTML = ""; return; }
    const at = atOf(c);
    const pair = { front: ["y", "x", "z"], top: ["z", "x", "y"], side: ["y", "z", "x"] }[face];
    const [rk, ck, dk] = pair; const R = members(c.axes[rk]), C = members(c.axes[ck]);
    const pickFor = (r, col) => (x, y, z) => ({ x, y, z })[rk] === r && ({ x, y, z })[ck] === col;
    const show = (v) => (v === null ? "" : typeof v === "number" ? fmt(v) : esc(v));
    $("face-title").innerHTML = `${c.parent ? `${esc(cube(c.parent).axes[c.via].name)}「${esc(disp(cube(c.parent).axes[c.via], at))}」の中 / ` : ""}行 <span class="${rk}">${esc(c.axes[rk].name)}</span> × 列 <span class="${ck}">${esc(c.axes[ck].name)}</span>(<span class="${dk}">${esc(c.axes[dk].name)}</span>は${AGG[c.value.agg]})`;
    const rowsHtml = R.map((r) => `<tr><th class="h${rk === "x" ? "x" : rk === "y" ? "y" : ""}" style="${rk === "z" ? "color:var(--ax-z)" : ""}">${esc(disp(c.axes[rk], r))}</th>${C.map((col) => { const v = aggregate(c, at, pickFor(r, col)); return `<td class="v ${v === null ? "zero" : ""}">${v === null ? "–" : show(v)}</td>`; }).join("")}</tr>`).join("");
    $("face").innerHTML = `<table><thead><tr><th></th>${C.map((col) => `<th style="color:var(--ax-${ck});text-align:right">${esc(disp(c.axes[ck], col))}</th>`).join("")}</tr></thead><tbody>${rowsHtml}</tbody></table>`;
  }

  function tick() {
    rotX += (targetX - rotX) * 0.15; rotY += (targetY - rotY) * 0.15;
    group.rotation.set(rotX, rotY, 0);
    camera.position.set(0, 0, dist); camera.lookAt(0, 0, 0);
    group.updateMatrixWorld(); renderer.render(scene, camera); renderLabelsOnly();
    requestAnimationFrame(tick);
  }

  // ---- 全体の操作 ----
  // ---- 画面の切り替え ----
  const EDIT = { axes: 1, members: 1, data: 1 };
  const VIEW_NAME = { dash: "ダッシュボード", cube: "キューブを見る", axes: "軸を決める", members: "目盛りを登録", data: "値を入れる" };
  function render() {
    renderTree();
    const v = VIEW_NAME[st.view] ? st.view : "dash"; st.view = v;
    if (v !== "dash" && !cube(st.selected) && st.cubes.length) st.selected = st.cubes[0].id;
    const c = cube(st.selected);
    document.querySelectorAll("#nav [data-view]").forEach((b) => b.setAttribute("aria-current", b.dataset.view === v));
    $("dash").hidden = v !== "dash";
    $("editor").hidden = !(v in EDIT);
    $("viewer").hidden = !(v === "cube" || v === "axes");
    $("views").classList.toggle("split", v === "axes");
    if (v === "dash") renderDash();
    if (v in EDIT) renderEditor(c, v);
    $("viewer-title").textContent = v === "axes" ? "プレビュー" : c ? c.name : "キューブがまだありません";
    $("viewer-sub").textContent = c && v === "cube" ? [chainOf(c).slice(0, -1).map((k) => k.name).join(" › "), kids(c.id).length ? `下位:${kids(c.id).map((k) => k.name).join("、")}` : ""].filter(Boolean).join(" / ") : "";
    renderPreview(); save();
  }
  function renderEditor(c, tab) {
    if (!c) {
      $("editor").innerHTML = `<h2>キューブを作りましょう</h2>
        <p style="margin:0 0 10px">左の「＋ 新しいキューブ」で作り始め、X軸(横)・Y軸(縦)・Z軸(奥行き)と、コマに入れる値を順に決めます。</p>
        <p class="hint">よくある形から始めるときは、左下の「テンプレートから始める」を使ってください。</p>`;
      return;
    }
    const chain = chainOf(c);
    $("editor").innerHTML = `
      <div class="crumbs">${chain.map((k, i) => i === chain.length - 1 ? `<span>${esc(k.name)}</span>` : `<button type="button" data-go="${k.id}">${esc(k.name)}</button><span>›</span>`).join("")}</div>
      <h2>${{ axes: "① 軸を決める", members: "② 目盛りを登録", data: "③ 値を入れる" }[tab]}</h2>
      <div id="pane"></div>`;
    ({ axes: renderAxes, members: renderMembers, data: renderData })[tab](c);
  }

  // ---- ダッシュボード ----
  function cubeStats(c) {
    const p = cube(c.parent);
    const xs = members(c.axes.x), ys = members(c.axes.y), zs = members(c.axes.z), ats = p ? members(p.axes[c.via]) : [""];
    const ok = { 0: new Set(ats), 1: new Set(xs), 2: new Set(ys), 3: new Set(zs) };
    const gk = AX.find((k) => c.axes[k].kind === "month") || "y"; const gi = { x: 1, y: 2, z: 3 }[gk];
    const by = new Map(members(c.axes[gk]).map((m) => [m, 0]));
    let filled = 0, sum = 0;
    for (const [key, v] of Object.entries(c.cells)) {
      const q = key.split(SEP); if (![0, 1, 2, 3].every((i) => ok[i].has(q[i]))) continue;
      filled++; const n = c.value.type === "text" ? 1 : Number(v) || 0; sum += n; by.set(q[gi], (by.get(q[gi]) || 0) + n);
    }
    return { total: xs.length * ys.length * zs.length * ats.length, filled, sum, gk, by };
  }
  function renderDash() {
    const all = st.cubes; const stats = new Map(all.map((c) => [c.id, cubeStats(c)]));
    const memberCount = all.reduce((n, c) => n + AX.reduce((m, k) => m + members(c.axes[k]).length, 0), 0);
    const filled = [...stats.values()].reduce((n, s) => n + s.filled, 0);
    const head = `<div class="dash-head"><div><h1>ダッシュボード</h1><p class="hint" style="margin:0">作ったキューブの入り具合と合計を一覧で見ます。カードから立体表示や入力に進めます。</p></div>
      <div class="card-actions"><button type="button" class="primary" data-act="new">＋ 新しいキューブ</button><button type="button" data-act="tpl">テンプレートから始める</button></div></div>`;
    if (!all.length) {
      $("dash").innerHTML = `${head}<div class="dash-empty"><b>まだキューブがありません</b><p class="hint" style="margin:0">「＋ 新しいキューブ」で白紙から作るか、「テンプレートから始める」で入金管理などの例を読み込みます。</p></div>`;
      return;
    }
    const fmtV = (c, n) => (c.value.type === "text" ? `${fmt(n)}件` : c.value.type === "money" ? `¥${fmt(n)}` : fmt(n));
    const card = (c) => {
      const s = stats.get(c.id); const pct = s.total ? Math.round((s.filled / s.total) * 100) : 0;
      const entries = [...s.by.entries()]; const shown = entries.slice(0, 8); const max = Math.max(...shown.map(([, n]) => Math.abs(n)), 1);
      const chain = chainOf(c).slice(0, -1);
      return `<article class="card">
        ${chain.length ? `<span class="crumb">${chain.map((k) => esc(k.name)).join(" › ")} ›</span>` : ""}
        <h3>${esc(c.name)}</h3>
        <div class="chips">${AX.map((k) => `<span class="chip ${k}">${k.toUpperCase()} ${esc(c.axes[k].name)} ${members(c.axes[k]).length}</span>`).join("")}<span class="chip">値 ${esc(c.value.name)}(${VTYPE[c.value.type]})</span></div>
        <div><div class="meter" role="img" aria-label="入力済み ${pct}%"><i style="width:${pct}%"></i></div>
          <p class="hint" style="margin:4px 0 0">入力済み ${fmt(s.filled)} / ${fmt(s.total)} コマ(${pct}%)${s.filled && c.value.type !== "text" ? ` ・ ${esc(c.value.name)}の合計 <b style="color:var(--ink)">${fmtV(c, s.sum)}</b>` : ""}</p></div>
        ${s.filled && shown.length ? `<div class="bars" aria-label="${esc(c.axes[s.gk].name)}ごとの${c.value.type === "text" ? "件数" : "合計"}">${shown.map(([m, n]) => `<div class="bar"><span class="lb" title="${esc(disp(c.axes[s.gk], m))}">${esc(disp(c.axes[s.gk], m))}</span><span class="tr"><i style="width:${Math.round((Math.abs(n) / max) * 100)}%"></i></span><span class="nv">${fmtV(c, n)}</span></div>`).join("")}${entries.length > 8 ? `<p class="hint" style="margin:0">ほか ${entries.length - 8} 件</p>` : ""}</div>` : `<p class="hint" style="margin:0">まだ値が入っていません。</p>`}
        ${kids(c.id).length ? `<p class="lowers" style="margin:0">下位:${kids(c.id).map((k) => `<button type="button" data-open="${k.id}" data-v="cube">${esc(k.name)}</button>`).join("、")}</p>` : ""}
        <div class="card-actions"><button type="button" class="primary" data-open="${c.id}" data-v="cube">立体で見る</button><button type="button" data-open="${c.id}" data-v="data">値を入れる</button><button type="button" data-open="${c.id}" data-v="axes">軸を直す</button></div>
      </article>`;
    };
    const order = []; const walk = (pid) => kids(pid).forEach((c) => { order.push(c); walk(c.id); }); walk(null);
    $("dash").innerHTML = `${head}
      <div class="kpis"><div class="kpi"><div class="k">キューブ</div><div class="v">${all.length}</div></div><div class="kpi"><div class="k">目盛り(全部の軸)</div><div class="v">${fmt(memberCount)}</div></div><div class="kpi"><div class="k">入力済みのコマ</div><div class="v">${fmt(filled)}</div></div></div>
      <div class="cards">${order.map(card).join("")}</div>`;
  }
  $("dash").onclick = (e) => {
    const o = e.target.closest("[data-open]"); if (o) { st.selected = o.dataset.open; st.view = o.dataset.v; render(); scrollTo(0, 0); return; }
    const a = e.target.closest("[data-act]"); if (!a) return;
    if (a.dataset.act === "new") $("new-cube").click(); else $("tpl-btn").click();
  };
  $("nav").onclick = (e) => { const b = e.target.closest("[data-view]"); if (!b) return; st.view = b.dataset.view; $("side").classList.remove("open"); $("menu-btn").setAttribute("aria-expanded", "false"); render(); scrollTo(0, 0); };
  $("menu-btn").onclick = () => { const open = $("side").classList.toggle("open"); $("menu-btn").setAttribute("aria-expanded", open); };
  $("tree").onclick = (e) => { const b = e.target.closest("button[data-id]"); if (b) { st.selected = b.dataset.id; if (st.view === "dash") st.view = "cube"; $("side").classList.remove("open"); sheet = null; bulk.ax = null; bulk.msg = ""; render(); } };
  $("editor").addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab]"); if (t) { st.tab = st.view = t.dataset.tab; render(); scrollTo(0, 0); return; }
    const g = e.target.closest("[data-go]"); if (g) { st.selected = g.dataset.go; render(); }
  });
  $("new-cube").onclick = () => { const c = newCube("新しいキューブ"); st.cubes.push(c); st.selected = c.id; st.tab = st.view = "axes"; render(); $("cube-name")?.select(); };
  $("add-lower").onclick = () => {
    const p = cube(st.selected); if (!p) return;
    const c = newCube(`${p.axes.x.name}ごとの中身`, p.id, "x"); st.cubes.push(c); st.selected = c.id; st.tab = st.view = "axes"; render(); $("cube-name")?.select();
  };
  $("add-upper").onclick = () => {
    const c = cube(st.selected); if (!c) return;
    const up = newCube("上位のキューブ", c.parent, c.parent ? c.via : null);
    up.axes.x = newAxis(c.name + "の区分", ["(区分1)"]);
    // 今のキューブを、上位の X 軸の目盛りごとの下位にする(今のデータは最初の目盛りの中に入れる)
    const moved = {}; for (const [k, v] of Object.entries(c.cells)) { const parts = k.split(SEP); parts[0] = "(区分1)"; moved[parts.join(SEP)] = v; }
    c.cells = moved; c.parent = up.id; c.via = "x";
    st.cubes.push(up); st.selected = up.id; st.tab = st.view = "axes"; render(); $("cube-name")?.select();
  };
  $("blank-btn").onclick = () => { $("tpl-panel").hidden = true; $("blank-confirm").hidden = false; };
  $("blank-no").onclick = () => { $("blank-confirm").hidden = true; };
  $("blank-yes").onclick = () => { st = blank(); sheet = null; $("blank-confirm").hidden = true; render(); };
  $("tpl-btn").onclick = () => { $("blank-confirm").hidden = true; $("tpl-panel").hidden = false; };
  $("tpl-close").onclick = () => { $("tpl-panel").hidden = true; };
  $("tpls").innerHTML = TEMPLATES.map((t, i) => `<button type="button" class="tpl" data-i="${i}"><b>${esc(t.name)}</b><span>${esc(t.note)}</span></button>`).join("");
  $("tpls").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; st = TEMPLATES[+b.dataset.i].make(); sheet = null; $("tpl-panel").hidden = true; render(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => renderPreview());

  resize(); render(); tick();
})();
</script>

</body>
</html>
