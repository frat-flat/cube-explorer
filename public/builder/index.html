<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>キューブ組み立て 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 左にキューブの木(上位・下位)、中央に軸の設定、右にプレビュー。狭い画面では縦に積む */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --sunk: #e9edef;
  --ink: #1b2428;
  --muted: #5d6b71;
  --line: #d5dde0;
  --accent: #0e6a70;
  --accent-soft: #d9eeef;
  --on-accent: #ffffff;
  --warn: #9a4b0c;
  --warn-soft: #fbead9;
  --ax-x: #7b4bb3;
  --ax-y: #2f8a4c;
  --ax-z: #c2407a;
  --ax-x-soft: #efe7f8;
  --ax-y-soft: #e2f3e7;
  --ax-z-soft: #fae6ef;
  --stage: #eef2f3;
  --font-display: "Zen Kaku Gothic New", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121719; --surface: #1a2124; --sunk: #232c30; --ink: #e3eaec; --muted: #9aa9ae; --line: #33403f;
    --accent: #5cc3c9; --accent-soft: #1d3a3c; --on-accent: #0b1a1b; --warn: #f0a868; --warn-soft: #3a2a1b;
    --ax-x: #b48be6; --ax-y: #6fcf8d; --ax-z: #ef7fb0; --ax-x-soft: #2c2338; --ax-y-soft: #1d3125; --ax-z-soft: #3a2230; --stage: #161d20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121719; --surface: #1a2124; --sunk: #232c30; --ink: #e3eaec; --muted: #9aa9ae; --line: #33403f;
  --accent: #5cc3c9; --accent-soft: #1d3a3c; --on-accent: #0b1a1b; --warn: #f0a868; --warn-soft: #3a2a1b;
  --ax-x: #b48be6; --ax-y: #6fcf8d; --ax-z: #ef7fb0; --ax-x-soft: #2c2338; --ax-y-soft: #1d3125; --ax-z-soft: #3a2230; --stage: #161d20;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; padding-inline: 0; padding-block: 0; }
/* 左のサイドバー(画面の切り替えとキューブの木)+右の画面 */
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 12px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { font-family: var(--font-display); font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.brand .ico { width: 13px; height: 13px; background: var(--accent); transform: rotate(45deg) scale(.85); border-radius: 2px; }
.menu-btn { display: none; margin-left: auto; }
.nav { display: grid; gap: 2px; }
.nav button { border: 0; text-align: left; background: transparent; padding: 7px 10px; border-radius: 6px; display: flex; align-items: center; gap: 8px; }
.nav button:hover { background: var(--sunk); }
.nav button[aria-current="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.nav .n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--sunk); color: var(--ink); font-size: 11px; font-family: var(--font-mono); }
.nav button[aria-current="true"] .n { background: var(--on-accent); color: var(--accent); }
.nav-sub { font-size: 11px; letter-spacing: .08em; color: var(--muted); margin: 14px 4px 4px; }
.side-foot { display: grid; gap: 6px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.main { min-width: 0; padding-inline: 20px; padding-block: 18px 40px; display: grid; gap: 12px; align-content: start; }
.views { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.views.split { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.25fr); } /* 軸の設定中も主役はキューブ */
@media (max-width: 1100px) { .views.split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-inline: 16px; }
  .menu-btn { display: inline-block; }
  .brand { margin-bottom: 0; }
  .side:not(.open) .side-body { display: none; }
  .side.open .brand { margin-bottom: 10px; }
  .main { padding-inline: 16px; }
}
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.lead { margin: 2px 0 0; color: var(--muted); max-width: 72ch; }
.tag { display: inline-block; font-size: 11px; letter-spacing: .06em; padding: 1px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); vertical-align: 3px; margin-left: 6px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 2px 6px; }
button.ghost:hover { color: var(--ink); }
.danger { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.panel-title { font-size: 12px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }

.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.notice { padding: 8px 10px; border-radius: 6px; background: var(--accent-soft); font-size: 13px; margin: 8px 0 0; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.empty { color: var(--muted); padding: 14px; text-align: center; }

/* キューブの木 */
.tree { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tree button { width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; display: flex; gap: 8px; align-items: center; }
.tree button:hover { background: var(--sunk); }
.tree button[aria-current="true"] { background: var(--accent-soft); font-weight: 700; }
.tree .ico { flex: none; width: 11px; height: 11px; background: var(--accent); transform: rotate(45deg) scale(.85); border-radius: 1px; }
.tree .via { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 400; white-space: nowrap; }
.tree-actions { display: grid; gap: 6px; margin-top: 10px; }
.tpls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
.tpl { text-align: left; display: grid; gap: 2px; padding: 10px 12px; }
.tpl span { font-size: 12px; color: var(--muted); }

/* 設定(中央) */
.crumbs { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.crumbs button { padding: 0 4px; border: 0; background: none; color: var(--accent); text-decoration: underline; }
h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 12px; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 7px 12px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.row { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px 10px; align-items: center; margin-bottom: 8px; }
.row > label { font-size: 13px; color: var(--muted); }
.axis-card { border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; border-left: 4px solid var(--c); background: var(--c-soft); }
.axis-card.x { --c: var(--ax-x); --c-soft: var(--ax-x-soft); }
.axis-card.y { --c: var(--ax-y); --c-soft: var(--ax-y-soft); }
.axis-card.z { --c: var(--ax-z); --c-soft: var(--ax-z-soft); }
.axis-card.v { --c: var(--accent); --c-soft: var(--accent-soft); }
.axis-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.axis-head .badge { font-family: var(--font-mono); font-weight: 500; color: var(--c); font-size: 13px; }
.axis-head input { flex: 1 1 140px; font-weight: 700; }
.axis-head .dir { font-size: 12px; color: var(--muted); }
.members { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.more-members { margin: 6px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.member { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; padding: 1px 2px 1px 8px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.member button { border: 0; background: none; padding: 0 5px; color: var(--muted); line-height: 1.3; }
.member .down { color: var(--accent); font-size: 11px; }
.add-member { display: flex; gap: 6px; flex-wrap: wrap; }
.add-member input { flex: 1 1 140px; }
.link-note { font-size: 12px; margin-top: 4px; color: var(--c); }
.month-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.month-row .check { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.axis-card .zoff { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 4px; }
.axis-card.off { background: var(--sunk); border-left-style: dashed; }
.axis-card.off .badge { opacity: .5; }
.member.calc { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn); font-weight: 700; }
.calcs { margin-top: 8px; padding-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--c) 40%, transparent); }
.calcs summary { cursor: pointer; font-size: 13px; color: var(--c); display: flex; gap: 8px; align-items: baseline; }
.calcs code { font-family: var(--font-mono); font-size: 12px; background: var(--surface); padding: 0 4px; border-radius: 4px; }
.calc-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.calc-row .cn { font-weight: 700; color: var(--warn); min-width: 5em; font-size: 13px; }
.calc-row input[data-calc], .calc-row input[data-f=calcexpr] { flex: 1 1 14em; min-width: 0; font-family: var(--font-mono); font-size: 13px; }
.calc-row input[data-f=calcname] { flex: 0 1 8em; min-width: 0; }
.calc-err { flex-basis: 100%; font-size: 12px; color: var(--warn); }
.calc-quick { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.calc-quick button { font-size: 12px; padding: 1px 6px; font-family: var(--font-mono); }
.sheet td.calc { background: var(--warn-soft); color: var(--warn); text-align: right; font-family: var(--font-mono); padding: 5px 6px; font-weight: 700; }
.sheet th.calc, .sheet tr.calc th { color: var(--warn); }
#face td.calc, #face tr.calc td, #face tr.calc th, #face th.calc { background: var(--warn-soft); font-weight: 700; }

/* データ入力 */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; white-space: nowrap; }
th { font-size: 12px; font-weight: 400; background: var(--sunk); }
th.hx { color: var(--ax-x); }
th.hy { color: var(--ax-y); }
td input { width: 100%; min-width: 80px; border-color: transparent; background: transparent; padding: 3px 4px; text-align: right; font-family: var(--font-mono); }
td input:hover { border-color: var(--line); }
td.v { text-align: right; font-family: var(--font-mono); }
td.v.zero { color: var(--muted); }
tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
.tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin-bottom: 10px; }
.tools label { font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
textarea { width: 100%; min-height: 110px; font-family: var(--font-mono); font-size: 12px; }
.map { display: grid; gap: 6px; margin: 10px 0; }
.map-row { display: grid; grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr); gap: 8px; align-items: center; }
.map-row .src { font-family: var(--font-mono); font-size: 12px; padding: 5px 8px; background: var(--sunk); border-radius: 6px; overflow: hidden; text-overflow: ellipsis; }

/* プレビュー */
.viewer-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
.viewer-head h2 { margin: 0; }
.viewer-body { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.views.split .viewer-body, .viewer.small .viewer-body { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1000px) { .viewer-body { grid-template-columns: minmax(0, 1fr); } }
.views.split .viewer { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.stage { position: relative; height: min(68vh, 640px); min-height: 320px; border-radius: 8px; background: var(--stage); overflow: hidden; user-select: none; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; transform: translate(-50%, -50%); font-size: 11px; white-space: nowrap; padding: 0 4px; border-radius: 3px; background: color-mix(in srgb, var(--surface) 85%, transparent); }
.lbl.x { color: var(--ax-x); } .lbl.y { color: var(--ax-y); } .lbl.z { color: var(--ax-z); }
.lbl.title { font-weight: 700; font-size: 12px; border: 1px solid currentColor; }
.snap { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; align-items: center; }
.snap button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.snap .sp { margin-left: auto; font-size: 12px; color: var(--muted); }
/* 目盛りが多い軸は、プレビューに映す範囲を送って見る */
.win-bar { display: grid; gap: 6px; margin: 0 0 8px; font-size: 12px; }
.win-bar .w { display: grid; grid-template-columns: minmax(0, auto) auto minmax(80px, 1fr) auto; gap: 6px; align-items: center; }
.win-bar .w span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.win-bar .w .x { color: var(--ax-x); } .win-bar .w .y { color: var(--ax-y); } .win-bar .w .z { color: var(--ax-z); }
.win-bar input[type=range] { width: 100%; min-width: 0; }
#face { max-height: min(70vh, 640px); overflow: auto; }
#face thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
#face tr.spacer td { padding: 0; border: 0; }
.win-bar .wl { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.win-bar .wl .x { color: var(--ax-x); } .win-bar .wl .y { color: var(--ax-y); } .win-bar .wl .z { color: var(--ax-z); }
.win-bar button { padding: 2px 8px; }
.cellinfo { min-height: 46px; font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--sunk); margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.cellinfo .k { color: var(--muted); font-size: 12px; }
.cellinfo .x { color: var(--ax-x); } .cellinfo .y { color: var(--ax-y); } .cellinfo .z { color: var(--ax-z); }
.cellinfo b { font-family: var(--font-mono); }
.face-title { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
.face-title .x { color: var(--ax-x); } .face-title .y { color: var(--ax-y); } .face-title .z { color: var(--ax-z); }
.notes { margin-top: 8px; padding-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--c) 40%, transparent); }
.notes summary { cursor: pointer; font-size: 13px; color: var(--c); display: flex; gap: 8px; align-items: baseline; }
.note-names { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.note-name { display: inline-flex; align-items: center; gap: 2px; }
.note-name input { width: 8.5em; padding: 3px 6px; font-size: 13px; }
.show-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; margin: 4px 0; }
.show-row > span:first-child { color: var(--muted); font-size: 12px; }
.show-row .x { color: var(--ax-x); } .show-row .y { color: var(--ax-y); } .show-row .z { color: var(--ax-z); }
.chk { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.note-table td input { text-align: left; font-family: var(--font-body); min-width: 150px; }
.note-table td:first-child { font-size: 13px; }
.sub { font-size: 13px; color: var(--c); margin: 8px 0 4px; }
.compose { display: grid; gap: 6px; }
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.part { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.pnum { font-family: var(--font-mono); font-size: 11px; color: var(--muted); width: 1.2em; text-align: right; }
.palts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; flex: 1 1 200px; min-width: 0; }
.pill { display: inline-flex; align-items: center; font-size: 13px; padding: 1px 2px 1px 8px; border-radius: 99px; background: var(--sunk); }
.pill button { padding: 0 5px; }
.or { font-size: 11px; color: var(--muted); padding: 0 2px; }
.part select { font-size: 12px; padding: 2px 4px; }
.pmove { display: flex; gap: 0; margin-left: auto; }
.compose-foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
.notes-bar details + details { margin-top: 4px; border-top: 1px solid var(--line); padding-top: 4px; }
.notes-bar summary { cursor: pointer; font-size: 13px; }
.notes-bar summary .x { color: var(--ax-x); } .notes-bar summary .y { color: var(--ax-y); } .notes-bar summary .z { color: var(--ax-z); }
.notes-bar .compose { margin-top: 6px; }
.bulk { margin-top: 8px; padding: 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.sheet-wrap { max-height: 460px; overflow: auto; }
.sheet { width: auto; min-width: 100%; }
.sheet th { position: sticky; top: 0; z-index: 1; padding: 3px; }
.sheet th select { width: 100%; min-width: 88px; font-size: 12px; padding: 3px 4px; font-weight: 700; }
.sheet th.hx select { color: var(--ax-x); } .sheet th.hy select { color: var(--ax-y); } .sheet th.hz select { color: var(--ax-z); } .sheet th.hv select { color: var(--accent); }
.sheet td { padding: 0; border-right: 1px solid var(--line); }
.sheet td input { min-width: 88px; width: 100%; text-align: left; font-family: var(--font-body); border-radius: 0; padding: 5px 6px; }
.sheet td input:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--surface); }
.sheet .rn { width: 1%; color: var(--muted); font-size: 11px; text-align: right; padding: 0 6px; background: var(--sunk); }
.tools label input[type=file] { font-size: 12px; }
.guide { list-style: none; counter-reset: g; display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; padding: 0; font-size: 12px; }
.guide li { counter-increment: g; padding: 2px 10px 2px 6px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.guide li::before { content: counter(g); display: inline-block; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 50%; margin-right: 4px; background: var(--line); color: var(--ink); font-size: 11px; }
.guide li.now { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.guide li.now::before { background: var(--on-accent); color: var(--accent); }
.guide-box { font-size: 13px; padding: 8px 12px; border-radius: 6px; background: var(--accent-soft); margin: 0 0 10px; }
.axis-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.axis-pick button { font-weight: 700; }

  const monthsBetween = (a, b) => {

  const TEMPLATES = [

  const VKEY = "cube-builder-versions-v1", PKEY = "cube-builder-presets-v1";

  let versions = loadJ(VKEY, {}), presets = loadJ(PKEY, { axes: [], cubes: [] });
  presets.axes ??= []; presets.cubes ??= [];
  { const ids = new Set(st.cubes.map((c) => c.id)); let gone = false; for (const id of Object.keys(versions)) if (!ids.has(id)) { delete versions[id]; gone = true; } if (gone) storeJ(VKEY, versions); } // 消したキューブの版は、次に開いたときに片付ける

  const versOf = (c) => versions[c.id] || [];
  const baseOf = (c) => { const l = versOf(c); return l.find((v) => v.id === st.base?.[c.id]) || l[l.length - 1] || null; };
  const dirtyOf = (c) => { const b = baseOf(c); return !b || b.snap !== snapOf(c); };
  let svMsg = "", svOpen = false;
  function saveVersion(c, memo, auto) {

    l.push(v); while (l.length > 30) l.shift();

  const doSave = () => {

  let face = "front", picked = null, importState = null, pendingDelete = null;

  const cube = (id) => st.cubes.find((c) => c.id === id);

  const chainOf = (c) => { const out = []; while (c) { out.unshift(c); c = cube(c.parent); } return out; };
  // 下位のキューブは、上位の目盛り(st.at[下位の id])ごとに中身を持つ

      $("editor").querySelector("[data-view-go]").onclick = () => { st.view = "cube"; render(); };
      return;
    }
    const chain = chainOf(c);
    $("editor").innerHTML = `
      <div class="crumbs">${chain.map((k, i) => i === chain.length - 1 ? `<span>${esc(k.name)}</span>` : `<button type="button" data-go="${k.id}">${esc(k.name)}</button><span>›</span>`).join("")}</div>
      <h2>${{ axes: "① 軸を決める", members: "② 目盛りを登録", data: "③ 値を入れる" }[tab]}</h2>
      <div id="pane"></div>`;
    ({ axes: renderAxes, members: renderMembers, data: renderData })[tab](c);
  }

  // ---- ダッシュボード ----
  function cubeStats(c) {
    if (c.synth) {
      const V = AX.map((k) => synthAxis(c, k)), tot = (a) => V[a].ps[V[a].v.length], cnt = (a) => V[a].pc[V[a].v.length];
      const by = new Map(members(c.axes.x).map((m, i) => [m, V[0].v[i] * tot(1) * tot(2)]));
      return { total: AX.reduce((n, k) => n * members(c.axes[k]).length, 1), filled: cnt(0) * cnt(1) * cnt(2), sum: tot(0) * tot(1) * tot(2), gk: "x", by };
    }
    const p = cube(c.parent);
    const xs = members(c.axes.x), ys = members(c.axes.y), zs = members(c.axes.z), ats = p ? members(p.axes[c.via]) : [""];
    const ok = { 0: new Set(ats), 1: new Set(xs), 2: new Set(ys), 3: new Set(zs) };
    const gk = AX.find((k) => c.axes[k].kind === "month") || "y"; const gi = { x: 1, y: 2, z: 3 }[gk];
    const by = new Map(members(c.axes[gk]).map((m) => [m, 0]));
    let filled = 0, sum = 0;
    for (const [key, v] of Object.entries(c.cells)) {
      const q = key.split(SEP); if (![0, 1, 2, 3].every((i) => ok[i].has(q[i]))) continue;
      filled++; const n = c.value.type === "text" ? 1 : Number(v) || 0; sum += n; by.set(q[gi], (by.get(q[gi]) || 0) + n);
    }
    return { total: xs.length * ys.length * zs.length * ats.length, filled, sum, gk, by };
  }
  function renderDash() {
    const all = st.cubes; const stats = new Map(all.map((c) => [c.id, cubeStats(c)]));
    const memberCount = all.reduce((n, c) => n + usedAx(c).reduce((m, k) => m + members(c.axes[k]).length, 0), 0);
    const filled = [...stats.values()].reduce((n, s) => n + s.filled, 0);
    const hall = st.dashMode !== "list";
    const head = `<div class="dash-head"><div><h1>ダッシュボード</h1><p class="hint" style="margin:0">${hall ? "展示室を歩いてキューブを見ます。作品をクリックすると前まで進み、札の「立体で見る」で開きます。「⋯」から名前の変更・複製・削除ができます。" : "作ったキューブの入り具合と合計を一覧で見ます。カードから立体表示や入力に進めます。"}</p></div>
      <div class="dash-modes"><div class="seg" role="group" aria-label="並べ方"><button type="button" data-dmode="hall" aria-pressed="${hall}">展示</button><button type="button" data-dmode="list" aria-pressed="${!hall}">一覧</button></div>
      <button type="button" class="primary" data-act="new">＋ 新しいキューブ</button><button type="button" data-act="tpl">テンプレートから始める</button></div></div>`;
    if (!all.length) {
      $("dash").innerHTML = `${head}<div class="dash-empty"><b>まだキューブがありません</b><p class="hint" style="margin:0">「＋ 新しいキューブ」で白紙から作るか、「テンプレートから始める」で入金管理などの例を読み込みます。</p></div>`;
      return;
    }
    const fmtV = (c, n) => (c.value.type === "text" ? `${fmt(n)}件` : c.value.type === "money" ? `¥${fmt(n)}` : fmt(n));
    const card = (c) => {
      const s = stats.get(c.id); const pct = s.total ? Math.round((s.filled / s.total) * 100) : 0;
      const entries = [...s.by.entries()]; const shown = entries.slice(0, 8); const max = Math.max(...shown.map(([, n]) => Math.abs(n)), 1);
      const chain = chainOf(c).slice(0, -1);
      return `<article class="card">
        ${chain.length ? `<span class="crumb">${chain.map((k) => esc(k.name)).join(" › ")} ›</span>` : ""}
        <h3>${esc(c.name)}</h3>
        <div class="chips">${AX.map((k) => (c.axes[k].off ? `<span class="chip">Zなし</span>` : `<span class="chip ${k}">${k.toUpperCase()} ${esc(c.axes[k].name)} ${members(c.axes[k]).length}</span>`)).join("")}<span class="chip">値 ${esc(c.value.name)}(${VTYPE[c.value.type]})</span></div>
        <div><div class="meter" role="img" aria-label="入力済み ${pct}%"><i style="width:${pct}%"></i></div>
          <p class="hint" style="margin:4px 0 0">入力済み ${fmt(s.filled)} / ${fmt(s.total)} コマ(${pct}%)${s.filled && c.value.type !== "text" ? ` ・ ${esc(c.value.name)}の合計 <b style="color:var(--ink)">${fmtV(c, s.sum)}</b>` : ""}</p></div>
        ${s.filled && shown.length ? `<div class="bars" aria-label="${esc(c.axes[s.gk].name)}ごとの${c.value.type === "text" ? "件数" : "合計"}">${shown.map(([m, n]) => `<div class="bar"><span class="lb" title="${esc(disp(c.axes[s.gk], m))}">${esc(disp(c.axes[s.gk], m))}</span><span class="tr"><i style="width:${Math.round((Math.abs(n) / max) * 100)}%"></i></span><span class="nv">${fmtV(c, n)}</span></div>`).join("")}${entries.length > 8 ? `<p class="hint" style="margin:0">ほか ${entries.length - 8} 件</p>` : ""}</div>` : `<p class="hint" style="margin:0">まだ値が入っていません。</p>`}
        ${kids(c.id).length ? `<p class="lowers" style="margin:0">下位:${kids(c.id).map((k) => `<button type="button" data-open="${k.id}" data-v="cube">${esc(k.name)}</button>`).join("、")}</p>` : ""}
        <div class="card-actions"><button type="button" class="primary" data-open="${c.id}" data-v="cube">立体で見る</button><button type="button" data-open="${c.id}" data-v="data">値を入れる</button><button type="button" data-open="${c.id}" data-v="axes">軸を直す</button><button type="button" class="ghost" data-cmenu="${c.id}" aria-haspopup="menu" style="margin-left:auto">⋯ その他</button></div>
      </article>`;
    };
    const order = []; const walk = (pid) => kids(pid).forEach((c) => { order.push(c); walk(c.id); }); walk(null);
    if (hall) {
      const hk = HALLS[st.hallTheme] ? st.hallTheme : OLD_HALL[st.hallTheme] || "modern";
      tagHtml = (c, i) => { const s = stats.get(c.id), p = cube(c.parent);
        return `<span class="no">No.${String(i + 1).padStart(2, "0")}${p ? ` ・ ${esc(p.name)}の下位` : ""}</span>
          <b class="ttl">${esc(c.name)}</b>
          <span class="axes">${usedAx(c).map((k) => `<i class="${k}">${esc(c.axes[k].name)}</i>`).join(" × ")}${c.axes.z.off ? "(2軸)" : ""}</span>
          <span class="meta">${fmt(s.filled)} / ${fmt(s.total)} コマ${s.filled && c.value.type !== "text" ? ` ・ ${esc(c.value.name)} ${fmtV(c, s.sum)}` : ""}</span>
          <span class="acts"><button type="button" data-open="${c.id}" data-v="cube">立体で見る</button>${c.synth ? "" : `<button type="button" data-open="${c.id}" data-v="data">値を入れる</button>`}<button type="button" data-cmenu="${c.id}" aria-haspopup="menu" aria-label="${esc(c.name)}のメニュー">⋯</button></span>`; };
      $("dash").innerHTML = `${head}<section class="museum" aria-label="キューブの展示室">
        <div class="mu-stage" id="mu-stage"><div class="mu-tags" id="mu-tags"></div>
          <div class="mu-top"><div class="mu-title"><span class="mu-kicker">CUBE COLLECTION</span><b>${esc(HALLS[hk].name)}</b><span>${all.length}点 ・ 入力済み ${fmt(filled)} コマ</span></div>
            <label class="mu-theme"><span>展示場</span><select id="mu-theme">${HALL_ORDER.map((k, i) => `<option value="${k}" ${k === hk ? "selected" : ""}>${i + 1}. ${esc(HALLS[k].name)}</option>`).join("")}</select></label></div>
          <canvas class="mu-map" id="mu-map" width="380" height="300" role="img" aria-label="館内の地図。番号を押すとその作品の前へ進みます"></canvas>
          <div class="mu-nav"><button type="button" data-mu="prev">◀ 前の作品</button><button type="button" data-mu="entrance">入口へ</button><button type="button" data-mu="next">次の作品 ▶</button><button type="button" data-mu="tags" aria-pressed="${MU.showAll}">札をすべて表示</button></div>
        </div>
        <div class="mu-strip"><p class="mu-help"><b>${esc(HALLS[hk].tip)}</b> 床をクリックでそこへ進む ・ 作品をクリックで作品の前へ ・ ドラッグで見回す ・ 矢印キーか WASD で歩く ・ 作品の前に立つか指すと札が出ます</p>
          <div class="mu-list">${order.map((c, i) => `<button type="button" data-mugo="${c.id}"><span>${String(i + 1).padStart(2, "0")}</span>${esc(c.name)}</button>`).join("")}</div></div>
      </section>`;
      muSet(order, hk, $("dash")); return;
    }
    $("dash").innerHTML = `${head}
      <div class="kpis"><div class="kpi"><div class="k">キューブ</div><div class="v">${all.length}</div></div><div class="kpi"><div class="k">目盛り(全部の軸)</div><div class="v">${fmt(memberCount)}</div></div><div class="kpi"><div class="k">入力済みのコマ</div><div class="v">${fmt(filled)}</div></div></div>
      <div class="cards">${order.map(card).join("")}</div>`;
  }
  $("dash").onclick = (e) => {
    const dm = e.target.closest("[data-dmode]"); if (dm) { st.dashMode = dm.dataset.dmode; render(); return; }
    const mu = e.target.closest("[data-mu]");
    if (mu) { const a = mu.dataset.mu; if (a === "prev") muStep(-1); if (a === "next") muStep(1); if (a === "entrance") muEntrance(); if (a === "tags") { MU.showAll = !MU.showAll; mu.setAttribute("aria-pressed", MU.showAll); } return; }
    const mg = e.target.closest("[data-mugo]"); if (mg) { const it = MU.items.find((x) => x.id === mg.dataset.mugo); if (it) muGoItem(it); return; }
    const o = e.target.closest("[data-open]"); if (o) { st.selected = o.dataset.open; st.view = o.dataset.v; render(); scrollTo(0, 0); return; }
    const a = e.target.closest("[data-act]"); if (!a) return;
    if (a.dataset.act === "new") $("new-cube").click(); else $("tpl-btn").click();
  };
  $("dash").addEventListener("change", (e) => { if (e.target.id === "mu-theme") { st.hallTheme = e.target.value; render(); } });
  $("nav").onclick = (e) => { const b = e.target.closest("[data-view]"); if (!b) return; st.view = b.dataset.view; $("side").classList.remove("open"); $("menu-btn").setAttribute("aria-expanded", "false"); render(); scrollTo(0, 0); };
  $("menu-btn").onclick = () => { const open = $("side").classList.toggle("open"); $("menu-btn").setAttribute("aria-expanded", open); };
  $("tree").onclick = (e) => { const b = e.target.closest("button[data-id]"); if (b) { st.selected = b.dataset.id; if (st.view === "dash") st.view = "cube"; $("side").classList.remove("open"); sheet = null; bulk.ax = null; bulk.msg = ""; render(); } };
  $("editor").addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab]"); if (t) { st.tab = st.view = t.dataset.tab; render(); scrollTo(0, 0); return; }
    const g = e.target.closest("[data-go]"); if (g) { st.selected = g.dataset.go; render(); }
  });
  $("new-cube").onclick = () => { const c = newCube("新しいキューブ"); st.cubes.push(c); st.selected = c.id; st.tab = st.view = "axes"; render(); $("cube-name")?.select(); };
  $("add-lower").onclick = () => {
    const p = cube(st.selected); if (!p) return;
    const c = newCube(`${p.axes.x.name}ごとの中身`, p.id, "x"); st.cubes.push(c); st.selected = c.id; st.tab = st.view = "axes"; render(); $("cube-name")?.select();
  };
  $("add-upper").onclick = () => {
    const c = cube(st.selected); if (!c) return;
    const up = newCube("上位のキューブ", c.parent, c.parent ? c.via : null);
    up.axes.x = newAxis(c.name + "の区分", ["(区分1)"]);
    // 今のキューブを、上位の X 軸の目盛りごとの下位にする(今のデータは最初の目盛りの中に入れる)
    const moved = {}; for (const [k, v] of Object.entries(c.cells)) { const parts = k.split(SEP); parts[0] = "(区分1)"; moved[parts.join(SEP)] = v; }
    c.cells = moved; c.parent = up.id; c.via = "x";
    st.cubes.push(up); st.selected = up.id; st.tab = st.view = "axes"; render(); $("cube-name")?.select();
  };
  $("blank-btn").onclick = () => { $("tpl-panel").hidden = true; $("blank-confirm").hidden = false; };
  $("blank-no").onclick = () => { $("blank-confirm").hidden = true; };
  $("blank-yes").onclick = () => { st = blank(); sheet = null; $("blank-confirm").hidden = true; render(); };
  $("tpl-btn").onclick = () => { $("blank-confirm").hidden = true; $("tpl-panel").hidden = false; };
  $("tpl-close").onclick = () => { $("tpl-panel").hidden = true; };
  // 用意したテンプレートは今の内容を置き換える。自分で保存したテンプレートは、新しいキューブとして足す
  const axSummary = (cb) => AX.filter((k) => !cb.axes[k].off).map((k) => cb.axes[k].name).join(" × ");
  function renderTpls() {
    $("tpls").innerHTML = TEMPLATES.map((t, i) => `<button type="button" class="tpl" data-i="${i}"><b>${esc(t.name)}</b><span>${esc(t.note)}${i === 2 ? "" : "(選ぶと今の内容は置き換わります)"}</span></button>`).join("")
      + (presets.cubes.length ? `<p class="tpl-sec" style="grid-column:1/-1">自分のテンプレート(選ぶと新しいキューブとして足します)</p>` + presets.cubes.map((t) => `<div class="tpl-wrap" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px"><button type="button" class="tpl mine" data-u="${t.id}"><b>${esc(t.name)}</b><span>${esc(axSummary(t.cube))} ・ 値:${esc(t.cube.value.name)}${AX.some((k) => calcOf(t.cube.axes[k]).length) ? " ・ 計算の目盛りあり" : ""}</span></button><button type="button" class="ghost" data-udel="${t.id}" aria-label="${esc(t.name)}を消す">×</button></div>`).join("") : "")
      + (presets.axes.length ? `<p class="tpl-sec" style="grid-column:1/-1">自分で保存した軸のプリセット(① の各軸の「プリセット」で使います)</p><div class="pre-list" style="grid-column:1/-1">${presets.axes.map((p) => `<span class="member">${esc(p.name)}<button type="button" data-pdel="${p.id}" aria-label="${esc(p.name)}を消す">×</button></span>`).join("")}</div>` : "");
  }
  renderTpls();
  $("tpls").onclick = (e) => {
    const ud = e.target.closest("[data-udel]"); if (ud) { presets.cubes = presets.cubes.filter((t) => t.id !== ud.dataset.udel); storeJ(PKEY, presets); renderTpls(); return; }
    const pd = e.target.closest("[data-pdel]"); if (pd) { presets.axes = presets.axes.filter((p) => p.id !== pd.dataset.pdel); storeJ(PKEY, presets); renderTpls(); if (st.view === "axes") render(); return; }
    const u = e.target.closest("[data-u]");
    if (u) {
      const t = presets.cubes.find((x) => x.id === u.dataset.u); const c = newCube(t.name);
      c.axes = JSON.parse(JSON.stringify(t.cube.axes)); c.value = { ...t.cube.value };
      st.cubes.push(c); st.selected = c.id; st.tab = st.view = "axes"; sheet = null; $("tpl-panel").hidden = true;
      saveVersion(c, `テンプレート「${t.name}」から作成`, true); render(); return;
    }
    const b = e.target.closest("button[data-i]"); if (!b) return;
    st = TEMPLATES[+b.dataset.i].make(); sheet = null; $("tpl-panel").hidden = true;
    for (const c of st.cubes) if (!c.synth && !versOf(c).length) saveVersion(c, "テンプレートから作成", true);
    render();
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => renderPreview());

  resize(); render(); tick();
})();
</script>

</body>
