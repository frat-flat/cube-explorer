<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シートの器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 左にシートとつながりの設定、右に器(外枠)の立体。器の中にシートを入れる/面に当てる */
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#1d2430; --muted:#5f6b7c; --line:#d5dae2;
  --paper:#fbfbf8; --paper2:#f1f2ee; --paperInk:#222a35; --paperLine:#c9ced6;
  --accent:#2d5bd7; --hl:#f2a516; --hlSoft:#fde7b6;
  --stack:#d6338a; --frame:#7d8899; --stage:#e3e7ed; --ax:#7a4fd0; --ay:#23935a;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141922; --panel:#1b222d; --ink:#e6eaf0; --muted:#98a3b3; --line:#2c3543;
  --paper:#243042; --paper2:#1f2938; --paperInk:#e6eaf0; --paperLine:#3a475a;
  --accent:#7ea2ff; --hl:#ffb938; --hlSoft:#5a4316;
  --stack:#ff6fb5; --frame:#8a97ab; --stage:#10151d; --ax:#b393ff; --ay:#5fd393; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --panel:#1b222d; --ink:#e6eaf0; --muted:#98a3b3; --line:#2c3543;
  --paper:#243042; --paper2:#1f2938; --paperInk:#e6eaf0; --paperLine:#3a475a;
  --accent:#7ea2ff; --hl:#ffb938; --hlSoft:#5a4316;
  --stack:#ff6fb5; --frame:#8a97ab; --stage:#10151d; --ax:#b393ff; --ay:#5fd393; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding:0 16px;box-sizing:border-box;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
.app{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:16px;padding-block:14px;height:100%}
aside{overflow:auto;display:flex;flex-direction:column;gap:12px;min-width:0;padding-bottom:20px}
main{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
h1{font-size:18px;margin:0;letter-spacing:.02em}
.lead{color:var(--muted);font-size:12.5px;margin:2px 0 0}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
section h2{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
textarea{width:100%;min-height:84px;font-family:var(--mono);font-size:12px;-webkit-user-select:text;user-select:text}
input[type=text]{min-width:0}
.sheetlist{display:flex;flex-direction:column;gap:6px}
.sheet{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:6px}
.sheet.active{border-color:var(--accent)}
.sheet .nm{font-weight:700;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .meta{grid-column:2/4;color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sheet select{font-size:12px;padding:2px 4px}
.pill{font-size:11px;border-radius:99px;padding:0 7px;border:1px solid currentColor}
.pill.stack{color:var(--stack)}
.links{display:flex;flex-direction:column;gap:4px;font-size:13px}
.link{display:flex;gap:6px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
.link b{font-weight:500}
.x{border:none;background:none;color:var(--muted);padding:0 4px}
.stagebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stagebar .sp{flex:1}
#stage{position:relative;flex:1;min-height:340px;border-radius:10px;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#crumbs{position:absolute;left:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 20px)}
#crumbs button{font-size:12.5px;padding:2px 8px;background:var(--panel)}
#crumbs button.cur{border-color:var(--hl);background:var(--hlSoft)}
#crumbs .tg{margin-left:10px;border-color:var(--stack);color:var(--stack)}
#filters{position:absolute;left:10px;top:44px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;max-width:calc(100% - 20px)}
#filters select,#filters button{font-size:12.5px;padding:1px 6px;background:var(--panel)}
#filters .lb{color:var(--muted)}
#filters button.on{background:var(--stack);border-color:var(--stack);color:#fff}
#filters .chip{border-color:var(--hl);background:var(--hlSoft)}
tfoot td{font-weight:700;background:var(--paper2);cursor:default}
td.sum{font-weight:700}
#crumbs span{color:var(--muted);font-size:12px}
#hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none}
#chain{font-size:13px;min-height:22px}
.dv,.go{font-size:11.5px;padding:0 7px;border:1px solid var(--stack);color:var(--stack);background:var(--panel);border-radius:99px;line-height:1.6}
.dv{margin-left:8px;font-family:var(--sans)}
.go{font-size:12.5px;padding:2px 10px;margin:4px 6px 0 0}
.dv:hover,.go:hover{background:var(--stack);color:#fff;border-color:var(--stack)}
#chain .step{display:inline-block;background:var(--hlSoft);border-radius:4px;padding:0 6px;margin:2px 2px 2px 0}
.tablewrap{overflow:auto;max-height:240px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;font-size:13px;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--paper2);font-weight:700;font-size:12px}
td{font-family:var(--mono);font-size:12.5px;cursor:pointer}
td[contenteditable]:focus{outline:2px solid var(--accent);-webkit-user-select:text;user-select:text;cursor:text}
tr.hl td{background:var(--hlSoft)}
.tag{font-size:10.5px;color:var(--muted);font-weight:400;margin-left:4px}
.note{font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);height:auto}
  main{order:-1}
  #stage{height:62vh;flex:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="app">
<aside>
  <div>
    <h1>シートの器</h1>
    <p class="lead">シートが主役です。シートを器の中に入れるか面に当て、列どうしをつなぐと、行のつながりが線で見えます。同じ形のシートは重ねると軸になります。</p>
  </div>

  <section>
    <h2>器(外枠)</h2>
    <div class="row">
      <button id="shapeCube" class="on">立方体</button>
      <button id="shapeCyl">円柱</button>
      <span class="note">形を変えても中のシートとつながりはそのまま</span>
    </div>
  </section>

  <section>
    <h2>シート</h2>
    <div class="sheetlist" id="sheetlist"></div>
    <div class="row">
      <input type="text" id="axisName" value="月" size="6" aria-label="重ねる軸の名前">
      <button id="makeStack" disabled>選んだシートを重ねて軸にする</button>
    </div>
    <p class="note">列が同じシートを2枚以上チェックすると重ねられます。重ねた束は奥行きの軸になり、各シートが目盛りになります。</p>
  </section>

  <section>
    <h2>つながり(リレーション)</h2>
    <div class="links" id="links"></div>
    <div class="row">
      <select id="lnFrom" aria-label="つなぐ元のシート"></select>
      <select id="lnFromCol" aria-label="つなぐ元の列"></select>
    </div>
    <div class="row">
      <span>→</span>
      <select id="lnTo" aria-label="つなぐ先のシート"></select>
      <select id="lnToCol" aria-label="つなぐ先の列"></select>
      <button id="lnAdd">つなぐ</button>
    </div>
  </section>

  <section>
    <h2>シートを足す</h2>
    <input type="text" id="newName" placeholder="シートの名前(例:担当者)">
    <textarea id="newData" placeholder="Excel の範囲をそのまま貼る(1行目が列の名前)">担当者ID	氏名	法人ID
T-01	高橋 真	H-01
T-02	伊藤 葵	H-02
T-03	渡辺 陸	H-03</textarea>
    <div class="row"><button id="addSheet" class="primary">シートを作る</button><button id="reset">サンプルに戻す</button></div>
  </section>
</aside>

<main>
  <div class="stagebar">
    <button data-view="oblique" class="on">斜め</button>
    <button data-view="front">正面</button>
    <button data-view="top">上から</button>
    <button data-view="side">横から</button>
    <span class="sp"></span>
    <button id="lineMode">線: シートどうし</button>
    <button id="clearSel">選択を外す</button>
  </div>
  <div id="stage"><div id="crumbs" hidden></div><div id="filters" hidden></div><div id="hint">ドラッグで回す・ホイールで寄る・行を押すとつながる行が光る・「▸ 内訳」で潜る</div></div>
  <div id="chain"></div>
  <div class="tablewrap"><table id="table"></table></div>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
// ---------- データ ----------
const SAMPLE = () => ({
  shape: 'cube',
  sheets: [
    { id:'app', name:'申込者', cols:['申込者ID','氏名','申込日'], rows:[
      ['A-001','佐藤 健','2026-04-02'],['A-002','鈴木 結衣','2026-04-11'],['A-003','山田 翔','2026-05-07'],
      ['A-004','中村 美咲','2026-05-20'],['A-005','小林 咲','2026-06-03'],['A-006','加藤 大和','2026-06-18']]},
    { id:'con', name:'契約者', cols:['契約者ID','申込者ID','契約日'], rows:[
      ['K-01','A-001','2026-04-15'],['K-02','A-002','2026-04-28'],['K-03','A-003','2026-05-19'],
      ['K-04','A-005','2026-06-12'],['K-05','A-006','2026-06-30']]},
    { id:'corp', name:'法人', cols:['法人ID','契約者ID','法人名','課税区分'], rows:[
      ['H-01','K-01','株式会社みどり堂','課税'],['H-02','K-02','合同会社すずらん','課税'],['H-03','K-03','山田商店','免税'],
      ['H-04','K-04','こばやし雑貨','免税'],['H-05','K-05','株式会社カトウ','課税']]},
    { id:'shop', name:'ショップ', cols:['ショップID','法人ID','モール','店名'], rows:[
      ['S-01','H-01','楽天','みどり堂 本店'],['S-02','H-01','Yahoo','みどり堂 Yahoo店'],['S-03','H-02','楽天','すずらん'],
      ['S-04','H-03','楽天','山田商店'],['S-05','H-04','Yahoo','こばやし雑貨'],['S-06','H-05','楽天','カトウ公式'],['S-07','H-05','Yahoo','カトウ Yahoo店']]},
    ...['2026-07','2026-08','2026-09'].map((m,mi) => ({ id:'pay'+mi, name:'入金 '+m, member:m, cols:['ショップID','売上','システム費用'], drill:{ 1:'sales', 2:'fee' },
      rows:['S-01','S-02','S-03','S-04','S-05','S-06','S-07'].map((s,i) => {
        const v = Math.round((180 + i*47 + mi*23 + (i*mi*13)%40) * 1000);
        return [s, v.toLocaleString(), Math.round(v*0.08).toLocaleString()];
      })}))
  ],
  stacks: [{ id:'st-pay', name:'入金', axis:'月', members:['pay0','pay1','pay2'] }],
  links: [
    { from:'con', fcol:1, to:'app', tcol:0 },
    { from:'corp', fcol:1, to:'con', tcol:0 },
    { from:'shop', fcol:1, to:'corp', tcol:0 },
    { from:'st-pay', fcol:0, to:'shop', tcol:0 }
  ],
  place: { app:'in', con:'in', corp:'in', shop:'in', 'st-pay':'in' }
});
const KEY = 'sheet-vessel-v2';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || SAMPLE(); } catch(e) { S = SAMPLE(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

let active = S.sheets[0].id;          // 下の表に出すシート
let sel = new Map();                 // sheetId -> Set(行)
let lineMode = 'schema';             // schema(シートどうし+選んだ行) | rows(行もすべて) | none
let path = [];                       // 潜った場所のたどり [{label, slots}]
const virt = new Map();              // 潜った先で作ったシート
const checked = new Set();

const sheet = id => S.sheets.find(s => s.id === id) || virt.get(id);
const stackOf = sid => S.stacks.find(st => st.members.includes(sid));
const slotSheets = slotId => { const st = S.stacks.find(s => s.id === slotId); return st ? st.members.map(sheet).filter(Boolean) : [sheet(slotId)].filter(Boolean); };
const slotName = slotId => { const st = S.stacks.find(s => s.id === slotId); return st ? st.name + '(' + st.axis + 'で重ね)' : (sheet(slotId)||{}).name; };
function slots() {
  const out = [], seen = new Set();
  for (const sh of S.sheets) {
    const st = stackOf(sh.id);
    if (st) { if (!seen.has(st.id)) { seen.add(st.id); out.push(st.id); } }
    else out.push(sh.id);
  }
  return out;
}
const placeOf = slotId => S.place[slotId] || 'in';
// 今見ている枠の一覧。潜っていなければ器の一番上、潜っていればその場所の中身
function viewSlots() {
  if (path.length) {
    // 潜った先のフィルター。データは消さず、見る範囲だけ絞る(y=行の値、z=重ねの目盛り)
    const e = path[path.length - 1], f = e.filters || {};
    return e.slots.map(sl => {
      let shs = sl.sheets;
      if (f.z) shs = shs.filter(x => x.member === f.z);
      if (f.y) shs = shs.map(x => { const c = { ...x, id: x.id + '~' + f.y, rows: x.rows.filter(r => r[0] === f.y) }; virt.set(c.id, c); return c; });
      return { ...sl, sheets: shs };
    });
  }
  return slots().map(id => { const st = S.stacks.find(s => s.id === id); return { id, sheets: slotSheets(id), stack: st ? { name: st.name, axis: st.axis } : null, place: placeOf(id) }; });
}
const viewLinks = () => path.length ? [] : S.links;

// ---------- 潜る(セルの内訳) ----------
const num = v => +String(v).replace(/[^\d.-]/g, '') || 0;
const fmt = n => Math.round(n).toLocaleString();
function rnd(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 13), 1597334677)) >>> 0) / 4294967296; }
function split(total, n, r) { const w = Array.from({ length: n }, () => .4 + r()), sum = w.reduce((a, b) => a + b); const out = w.map(x => Math.round(total * x / sum / 10) * 10); out[n - 1] += total - out.reduce((a, b) => a + b); return out; }
// 試作なので内訳は値から作る。本番では潜った先のシートを持つ(設計書「潜る」)
const DRILLS = {
  sales: (v, seed) => { const r = rnd(seed), cats = ['衣料', '雑貨', '食品', 'コスメ'], tot = split(num(v), 4, r);
    return { name: '売上の内訳', xName: '週', valueCols: [1, 2, 3, 4], cols: ['カテゴリ', '第1週', '第2週', '第3週', '第4週', '計'], drill: { 1: 'days', 2: 'days', 3: 'days', 4: 'days' },
      rows: cats.map((c, i) => [c, ...split(tot[i], 4, r).map(fmt), fmt(tot[i])]) }; },
  fee: (v, seed) => { const r = rnd(seed), items = ['決済手数料', '出店料', 'ポイント原資', '広告費'];
    return { name: 'システム費用の内訳', xName: '金額', valueCols: [1], cols: ['項目', '金額'], rows: split(num(v), 4, r).map((x, i) => [items[i], fmt(x)]) }; },
  days: (v, seed) => { const r = rnd(seed), d = ['月', '火', '水', '木', '金', '土', '日'], amt = split(num(v), 7, r);
    return { name: '日別', xName: '売上', valueCols: [2], cols: ['曜日', '注文数', '売上'], rows: d.map((x, i) => [x, String(Math.max(1, Math.round(amt[i] / 4800))), fmt(amt[i])]) }; }
};
let vid = 0;
let diveView = 'cube';   // 潜った先を 子のキューブ(cube) か シート(sheet) で見る
let selCell = null;      // 子のキューブで選んだコマ
function dive(sh, r, c) {
  const kind = sh.drill && sh.drill[c]; if (!kind) return false;
  const slot = viewSlots().find(s => s.sheets.some(x => x.id === sh.id));
  const members = slot && slot.stack && slot.sheets.length > 1 ? slot.sheets : [sh];
  const key = sh.rows[r][0];
  const inner = members.map(m => {
    const rr = m.id === sh.id ? r : m.rows.findIndex(x => x[0] === key); if (rr < 0) return null;
    const g = DRILLS[kind](m.rows[rr][c], m.id + ':' + rr + ':' + c);
    g.id = 'v' + (++vid); g.member = m.member; virt.set(g.id, g); return g;
  }).filter(Boolean);
  const label = key + ' の' + sh.cols[c] + (members.length > 1 ? '(' + slot.stack.axis + 'ごと)' : sh.member ? '(' + sh.member + ')' : '');
  enter({ label, filters: {}, slots: [{ id: 'd' + vid, sheets: inner, stack: members.length > 1 ? { name: inner[0].name, axis: slot.stack.axis } : null, place: 'in' }] },
    cellWorld(sh.id, r, c) || blockWorld(sh.id, r, c));
  return true;
}
function enter(entry, p) {
  const go = () => {
    selCell = null; path.push(entry);
    sel = new Map(); const v = viewSlots()[0].sheets; active = (v[v.length - 1] || {}).id;
    Object.assign(camGoal, { tx: 0, ty: 0, tz: 0, dist: diveView === 'cube' ? 20 : 15 }); cam.dist = 8;
    viewChanged();
  };
  if (p && !reduce) { Object.assign(camGoal, { tx: p.x, ty: p.y, tz: p.z, dist: 5 }); setTimeout(go, 380); } else go();
}
// 列ごと潜る:その列の全行(全ショップ)の内訳を、行を目盛りにして重ねる。月は重ねの目盛りから1つ選ぶ
function diveColumn(sh, c) {
  const kind = sh.drill && sh.drill[c]; if (!kind) return false;
  const slot = viewSlots().find(s => s.sheets.some(x => x.id === sh.id));
  const months = slot && slot.stack && slot.sheets.length > 1 ? slot.sheets : [sh];
  const who = sh.cols[0].replace(/ID$/, '');
  const make = m => m.rows.map((row, rr) => { const g = DRILLS[kind](row[c], m.id + ':' + rr + ':' + c); g.id = 'v' + (++vid); g.member = row[0]; virt.set(g.id, g); return g; });
  const entry = { base: '全' + who + 'の' + sh.cols[c], months, monthIdx: months.indexOf(sh), make, filters: {},
    slots: [{ id: 'd' + (++vid), sheets: make(sh), stack: { name: '', axis: who }, place: 'in' }] };
  entry.label = entry.base + (sh.member ? '(' + sh.member + ')' : '');
  const o = meshes.find(m => m.sh.id === sh.id);
  enter(entry, o ? o.mesh.getWorldPosition(new THREE.Vector3()) : null);
  return true;
}
function setMonth(i) {
  const e = path[path.length - 1]; e.monthIdx = i;
  e.slots[0].sheets = e.make(e.months[i]); e.label = e.base + '(' + e.months[i].member + ')';
  sel = new Map(); selCell = null; viewChanged();
}
function renderFilters() {
  const el = document.getElementById('filters'), e = path[path.length - 1];
  el.hidden = !e; if (!e) return;
  const sl = e.slots[0], f0 = sl.sheets[0], f = e.filters;
  const ys = f0 ? f0.rows.map(r => r[0]) : [], zs = sl.stack && sl.sheets.length > 1 ? sl.sheets.map(x => x.member) : [];
  let h = '';
  if (e.months && e.months.length > 1) h += '<span class="lb">月:</span>' + e.months.map((m, i) => `<button data-m="${i}"${i === e.monthIdx ? ' class="on"' : ''}>${esc(m.member)}</button>`).join('');

    fs.rows.forEach((r, i) => (idx.get(r[link.fcol]) || []).forEach(j => out.push({ fs: fs.id, fr: i, ts: ts.id, tr: j })));

  for (const dir of ['up', 'down']) {
    const seen = new Set([sid + ':' + row]), q = [[sid, row]];
    while (q.length) {

function tick() {
  const k = reduce ? 1 : .15;
  for (const key of ['yaw', 'pitch', 'dist', 'tx', 'ty', 'tz']) cam[key] += (camGoal[key] - cam[key]) * k;
  camera.position.set(cam.tx + cam.dist * Math.cos(cam.pitch) * Math.sin(cam.yaw), cam.ty + cam.dist * Math.sin(cam.pitch), cam.tz + cam.dist * Math.cos(cam.pitch) * Math.cos(cam.yaw));
  camera.lookAt(cam.tx, cam.ty, cam.tz);
  renderer.render(scene, camera); requestAnimationFrame(tick);
}
const cv = renderer.domElement; let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0, yaw: camGoal.yaw, pitch: camGoal.pitch }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
  camGoal.yaw = drag.yaw - dx * .008; camGoal.pitch = Math.max(-1.5, Math.min(1.5, drag.pitch + dy * .008));
});
let lastUp = { t: 0, x: 0, y: 0 };
cv.addEventListener('pointerup', e => {
  if (drag && drag.moved < 5) {
    const now = performance.now(), dbl = now - lastUp.t < 400 && Math.hypot(e.clientX - lastUp.x, e.clientY - lastUp.y) < 10;
    lastUp = { t: dbl ? 0 : now, x: e.clientX, y: e.clientY };
    pick(e, dbl);
  }
  drag = null;
});
cv.addEventListener('wheel', e => { e.preventDefault(); camGoal.dist = Math.max(8, Math.min(60, camGoal.dist * (1 + Math.sign(e.deltaY) * .1))); }, { passive: false });
const ray = new THREE.Raycaster();
function pick(e, dbl) {
  const r = cv.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const hit = ray.intersectObjects([...meshes.map(m => m.mesh), ...blocks])[0];
  if (!hit) { sel = new Map(); selCell = null; refreshSelection(); return; }
  if (hit.object.userData.cell) {
    const { sid, r, c } = hit.object.userData.cell;
    if (dbl && dive(sheet(sid), r, c)) return;
    active = sid; selCell = { sid, r, c }; renderList(); select(sid, r); return;
  }
  const o = hit.object.userData.o, py = (1 - hit.uv.y) * o.ch, row = Math.floor((py - TITLEH - HEADH) / ROWH);
  const col = Math.floor((hit.uv.x * o.cw - PAD) / COLW);
  if (dbl && row >= 0 && row < o.sh.rows.length && dive(o.sh, row, col)) return;
  active = o.sh.id; renderList();
  if (row >= 0 && row < o.sh.rows.length) select(o.sh.id, row); else renderTable();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
  Object.assign(camGoal, VIEWS[b.dataset.view]);
});
const LINE_MODES = { schema: ['rows', '線: シートどうし'], rows: ['none', '線: 行もすべて'], none: ['schema', '線: なし'] };
document.getElementById('lineMode').onclick = e => { lineMode = LINE_MODES[lineMode][0]; e.target.textContent = LINE_MODES[lineMode][1]; styleLines(); };
document.getElementById('clearSel').onclick = () => { sel = new Map(); refreshSelection(); };

// ---------- 左の設定 ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function placeOptions(cur) {
  const opts = [['in', '器の中に入れる'], ...Object.entries(FACES).map(([k, F]) => [k, F.label + 'に当てる'])];
  return opts.map(([v, t]) => `<option value="${v}"${v === cur ? ' selected' : ''}>${t}</option>`).join('');
}
function renderList() {
  const list = $('sheetlist'); list.innerHTML = '';
  for (const id of slots()) {
    const st = S.stacks.find(s => s.id === id);
    const div = document.createElement('div'); div.className = 'sheet' + (slotSheets(id).some(s => s.id === active) ? ' active' : '');
    if (st) {
      div.innerHTML = `<span class="pill stack">重ね</span><span class="nm">${esc(st.name)}</span><button class="x" title="重ねをほどく">ほどく</button>
        <div class="meta">${esc(st.axis)}: ${st.members.map(m => esc(sheet(m).member || sheet(m).name)).join(' / ')} <select aria-label="置き方">${placeOptions(placeOf(id))}</select></div>`;
      div.querySelector('.nm').onclick = () => { active = st.members[0]; renderList(); renderTable(); };
      div.querySelector('.x').onclick = () => unstack(st.id);
    } else {
      const sh = sheet(id);
      div.innerHTML = `<input type="checkbox" aria-label="重ねる対象に選ぶ"${checked.has(id) ? ' checked' : ''}><span class="nm">${esc(sh.name)}</span><button class="x" title="シートを消す">×</button>
        <div class="meta">${sh.rows.length}行 × ${sh.cols.length}列 <select aria-label="置き方">${placeOptions(placeOf(id))}</select></div>`;
      div.querySelector('input').onchange = e => { e.target.checked ? checked.add(id) : checked.delete(id); updateStackBtn(); };
      div.querySelector('.nm').onclick = () => { active = id; renderList(); renderTable(); };
      div.querySelector('.x').onclick = () => removeSheet(id);
    }
    div.querySelector('select').onchange = e => { S.place[id] = e.target.value; save(); build(); };
    list.appendChild(div);
  }
  updateStackBtn();
}
function updateStackBtn() {
  const ids = [...checked].filter(sheet);
  const same = ids.length >= 2 && ids.every(id => sheet(id).cols.join('\t') === sheet(ids[0]).cols.join('\t'));
  $('makeStack').disabled = !same;
  $('makeStack').title = ids.length >= 2 && !same ? '列の名前と並びが同じシートだけ重ねられます' : '';
}
$('makeStack').onclick = () => {
  const ids = S.sheets.map(s => s.id).filter(id => checked.has(id));
  const id = 'st-' + Date.now().toString(36), axis = $('axisName').value.trim() || '重ね';
  ids.forEach(m => { const sh = sheet(m); if (!sh.member) sh.member = sh.name; });
  S.stacks.push({ id, name: sheet(ids[0]).name.replace(/\s*\S+$/, '') || sheet(ids[0]).name, axis, members: ids });
  S.place[id] = placeOf(ids[0]);
  S.links = S.links.flatMap(l => {   // 束に入ったシートのつながりは束にまとめる
    const f = ids.includes(l.from) ? id : l.from, t = ids.includes(l.to) ? id : l.to;
    return [{ ...l, from: f, to: t }];
  }).filter((l, i, a) => a.findIndex(m => m.from === l.from && m.to === l.to && m.fcol === l.fcol && m.tcol === l.tcol) === i);
  checked.clear(); save(); renderAll();
};
function unstack(stId) {
  const st = S.stacks.find(s => s.id === stId);
  S.links = S.links.flatMap(l => l.from === stId ? st.members.map(m => ({ ...l, from: m })) : l.to === stId ? [{ ...l, to: st.members[0] }] : [l]);
  st.members.forEach(m => S.place[m] = placeOf(stId));
  S.stacks = S.stacks.filter(s => s !== st); save(); renderAll();
}
function removeSheet(id) {
  S.sheets = S.sheets.filter(s => s.id !== id);
  S.links = S.links.filter(l => l.from !== id && l.to !== id);
  if (active === id) active = S.sheets[0]?.id; sel = new Map(); save(); renderAll();
}
function renderLinks() {
  $('links').innerHTML = S.links.length ? '' : '<span class="note">まだつながりがありません</span>';
  S.links.forEach((l, i) => {
    const f = slotSheets(l.from)[0], t = slotSheets(l.to)[0]; if (!f || !t) return;
    const d = document.createElement('div'); d.className = 'link';
    d.innerHTML = `<span><b>${esc(slotName(l.from))}</b>.${esc(f.cols[l.fcol])} → <b>${esc(slotName(l.to))}</b>.${esc(t.cols[l.tcol])}</span><button class="x" aria-label="つながりを外す">×</button>`;
    d.querySelector('button').onclick = () => { S.links.splice(i, 1); save(); renderAll(); };
    $('links').appendChild(d);
  });
  const opts = slots().map(id => `<option value="${id}">${esc(slotName(id))}</option>`).join('');
  const keep = [$('lnFrom').value, $('lnTo').value];
  $('lnFrom').innerHTML = opts; $('lnTo').innerHTML = opts;
  if (keep[0] && slots().includes(keep[0])) $('lnFrom').value = keep[0];
  if (keep[1] && slots().includes(keep[1])) $('lnTo').value = keep[1]; else if (slots()[1]) $('lnTo').value = slots()[0];
  colOpts();
}
function colOpts() {
  for (const [s, c] of [['lnFrom', 'lnFromCol'], ['lnTo', 'lnToCol']]) {
    const sh = slotSheets($(s).value)[0];
    $(c).innerHTML = sh ? sh.cols.map((n, i) => `<option value="${i}">${esc(n)}</option>`).join('') : '';
  }
}
$('lnFrom').onchange = colOpts; $('lnTo').onchange = colOpts;
$('lnAdd').onclick = () => {
  const l = { from: $('lnFrom').value, fcol: +$('lnFromCol').value, to: $('lnTo').value, tcol: +$('lnToCol').value };
  if (l.from === l.to) return;
  S.links.push(l); save(); renderAll();
};
$('addSheet').onclick = () => {
  const txt = $('newData').value.trim(); if (!txt) return;
  const lines = txt.split(/\r?\n/).filter(x => x.trim());
  const sep = lines[0].includes('\t') ? '\t' : ',';
  const grid = lines.map(x => x.split(sep).map(v => v.trim()));
  const cols = grid[0], rows = grid.slice(1).map(r => cols.map((_, i) => r[i] ?? ''));
  const id = 'sh-' + Date.now().toString(36);
  S.sheets.push({ id, name: $('newName').value.trim() || 'シート' + (S.sheets.length + 1), cols, rows });
  S.place[id] = 'in'; active = id; save(); renderAll();
};
$('reset').onclick = () => { S = SAMPLE(); sel = new Map(); active = S.sheets[0].id; checked.clear(); save(); renderAll(); };
$('shapeCube').onclick = () => { S.shape = 'cube'; save(); renderAll(); };
$('shapeCyl').onclick = () => { S.shape = 'cyl'; save(); renderAll(); };

// ---------- 下の表とつながりの説明 ----------
// 子のキューブを見ているときは、下の表を「面の表」にする(重ねの目盛り × 行 × 値の列、合計つき)
function renderPivot(t) {
  const sl = viewSlots()[0], shs = sl.sheets, f = shs[0]; if (!f) { t.innerHTML = ''; return; }
  const vc = f.valueCols || f.cols.map((_, i) => i).slice(1), multi = sl.stack && shs.length > 1;
  const tot = vc.map(() => 0); let all = 0;
  const body = shs.flatMap(sh => sh.rows.map((r, ri) => {
    const sum = vc.reduce((a, c) => a + num(r[c]), 0); vc.forEach((c, i) => { tot[i] += num(r[c]); }); all += sum;
    return `<tr class="${isSel(sh.id, ri) ? 'hl' : ''}" data-s="${sh.id}" data-r="${ri}">${multi ? `<td>${esc(sh.member)}</td>` : ''}<td>${esc(r[0])}</td>${vc.map(c => `<td data-c="${c}" tabindex="0"><span class="v">${esc(r[c])}</span>${sh.drill && sh.drill[c] ? '<button class="dv" title="このマスの内訳へ潜る">▸ 内訳</button>' : ''}</td>`).join('')}<td class="sum">${fmt(sum)}</td></tr>`;
  })).join('');
  t.innerHTML = `<thead><tr>${multi ? `<th>${esc(sl.stack.axis)}</th>` : ''}<th>${esc(f.cols[0])}</th>${vc.map(c => `<th>${esc(f.cols[c])}</th>`).join('')}<th>計</th></tr></thead><tbody>${body}</tbody>
    <tfoot><tr>${multi ? '<td></td>' : ''}<td>合計</td>${tot.map(x => `<td>${fmt(x)}</td>`).join('')}<td>${fmt(all)}</td></tr></tfoot>`;
}
function renderTable() {
  if (path.length && diveView === 'cube') return renderPivot($('table'));
  const sh = sheet(active), t = $('table'); if (!sh) { t.innerHTML = ''; return; }
  const keyCols = new Set(viewLinks().filter(l => slotSheets(l.to).includes(sh)).map(l => l.tcol));
  const fk = new Map(viewLinks().filter(l => slotSheets(l.from).includes(sh)).map(l => [l.fcol, slotName(l.to)]));
  const title = sh.name + (sh.member && path.length ? ' ' + sh.member : '');
  t.innerHTML = `<thead><tr><th>${esc(title)}</th>${sh.cols.map((c, i) => `<th>${esc(c)}${fk.has(i) ? `<span class="tag">→ ${esc(fk.get(i))}</span>` : keyCols.has(i) ? '<span class="tag">鍵</span>' : sh.drill && sh.drill[i] ? `<button class="dv dvc" data-c="${i}" title="この列の全行の内訳へ潜る">▸ 全行の内訳</button>` : ''}</th>`).join('')}</tr></thead>
    <tbody>${sh.rows.map((r, ri) => `<tr class="${isSel(sh.id, ri) ? 'hl' : ''}" data-r="${ri}"><td>${ri + 1}</td>${r.map((v, ci) => sh.drill && sh.drill[ci] ? `<td data-c="${ci}" tabindex="0"><span class="v">${esc(v)}</span><button class="dv" title="このマスの内訳へ潜る">▸ 内訳</button></td>` : `<td data-c="${ci}" tabindex="0">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody>`;
}
$('table').addEventListener('click', e => {
  const hc = e.target.closest('.dvc'); if (hc) { diveColumn(sheet(active), +hc.dataset.c); return; }
  const tr = e.target.closest('tbody tr'), sh = sheet(tr && tr.dataset.s || active); if (!tr || !sh) return;
  const td = e.target.closest('td[data-c]');
  if (tr.dataset.s) active = sh.id;
  if (e.target.closest('.dv')) { dive(sh, +tr.dataset.r, +td.dataset.c); return; }
  selCell = td && sh.valueCols && sh.valueCols.includes(+td.dataset.c) ? { sid: sh.id, r: +tr.dataset.r, c: +td.dataset.c } : null;
  if (e.detail >= 2 && td) {   // 1回目の再描画で要素が替わっても効くよう、回数で判定。▸の列は潜る、それ以外は直す
    if (dive(sh, +tr.dataset.r, +td.dataset.c)) return;
    if (tr.dataset.s) return;
    td.contentEditable = 'true'; td.focus(); return;
  }
  if (!td || !td.isContentEditable) select(sh.id, +tr.dataset.r);
});
$('table').addEventListener('keydown', e => {
  const td = e.target.closest('td[data-c]'); if (!td || e.key !== 'Enter') return;
  e.preventDefault(); const sh = sheet(active);
  if (!td.isContentEditable && sh && dive(sh, +td.parentElement.dataset.r, +td.dataset.c)) return;
  td.isContentEditable ? td.blur() : (td.contentEditable = 'true', td.focus());
});
$('table').addEventListener('focusout', e => {
  const td = e.target.closest('td[data-c]'), sh = sheet(active); if (!td || !td.isContentEditable || !sh) return;
  td.contentEditable = 'false';
  sh.rows[+td.parentElement.dataset.r][+td.dataset.c] = (td.querySelector('.v') || td).textContent.trim(); save(); build(); refreshSelection();
});
function renderChain() {
  const el = $('chain');
  if (!sel.size) {
    const ex = !path.length && S.sheets.find(x => x.drill && x.rows.length);
    el.innerHTML = (path.length ? '<span class="note">潜った先です。立体の左上のパンくずで戻れます。子のキューブのコマを押すと表の行が光り、ダブルクリックするとさらに潜れます(表の「▸ 内訳」でも潜れます)。</span>'
      : '<span class="note">行を押すと、つながる行をたどって順に出します。「▸ 内訳」の付いたマスは押すと内訳へ潜れます。</span>')
      + (ex ? (() => { const st = stackOf(ex.id), last = st ? sheet(st.members[st.members.length - 1]) : ex, c = Object.keys(ex.drill)[0];
          return `<br><button class="go" data-s="${ex.id}" data-r="0" data-c="${c}">例: ${esc(ex.rows[0][0])} の${esc(ex.cols[c])}へ潜る ▸</button><button class="go" data-col="1" data-s="${last.id}" data-c="${c}">例: 全${esc(ex.cols[0].replace(/ID$/, ''))}の${esc(ex.cols[c])}(${esc(last.member || last.name)})へ潜る ▸</button>`; })() : '');
    return;
  }
  const order = viewSlots().flatMap(s => s.sheets).filter(s => sel.has(s.id));
  // 選んだ行に潜れるマスがあれば、ボタンで出す(重ねの目盛りごとに同じものは1つにまとめる)
  const gos = new Map();
  for (const s of order) if (s.drill) for (const r of sel.get(s.id)) for (const c of Object.keys(s.drill)) {
    const k = s.rows[r][0] + '|' + s.cols[c]; if (!gos.has(k)) gos.set(k, `<button class="go" data-s="${s.id}" data-r="${r}" data-c="${c}">${esc(s.rows[r][0])} の${esc(s.cols[c])}へ潜る ▸</button>`);
  }
  el.innerHTML = order.map(s => {
    const nc = s.cols.findIndex(c => /名$/.test(c)), rows = [...sel.get(s.id)].map(r => s.rows[r][nc >= 0 ? nc : 0]);
    return `<span class="step">${esc(s.name)}${s.member && path.length ? ' ' + esc(s.member) : ''} ${esc(rows.join('・'))}</span>`;
  }).join(' › ') + (selCell && sheet(selCell.sid) ? (() => { const sc = sheet(selCell.sid); return `<br><span class="step">選んだコマ: ${esc(sc.member || '')} ${esc(sc.rows[selCell.r][0])} × ${esc(sc.cols[selCell.c])} = ${esc(sc.rows[selCell.r][selCell.c])}</span>`; })() : '') + (gos.size ? '<br>' + [...gos.values()].join('') : '');
}
$('chain').addEventListener('click', e => { const b = e.target.closest('.go'); if (!b) return; b.dataset.col ? diveColumn(sheet(b.dataset.s), +b.dataset.c) : dive(sheet(b.dataset.s), +b.dataset.r, +b.dataset.c); });

function renderAll() {
  $('shapeCube').classList.toggle('on', S.shape === 'cube'); $('shapeCyl').classList.toggle('on', S.shape !== 'cube');
  renderList(); renderLinks(); build(); renderTable(); renderChain(); renderCrumbs(); renderFilters();
}
function applyTheme() { scene.background = new THREE.Color(css('--stage')); build(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

resize(); scene.background = new THREE.Color(css('--stage'));
renderAll(); tick();
document.fonts?.ready.then(() => build());
})();
</script>
