<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜の美術館 Blender版</title>
<style>
  /* 夜の館内:画面いっぱいの 3D に、暗いガラスの札とボタンを重ねる */
  :root { --bg: #040506; --ink: #eef0f2; --muted: #9aa3ad; --panel: rgba(12,14,18,.72); --line: rgba(255,255,255,.14); --alarm: #ff3a30; --brass: #c9a25a; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 "Noto Sans JP", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .top { position: fixed; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
  .title { background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
  .title b { display: block; font-size: 15px; }
  .title span { color: var(--muted); font-size: 12px; }
  #hud { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: 12px/1.4 ui-monospace, "IBM Plex Mono", monospace; letter-spacing: .05em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .btns { position: fixed; right: 16px; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; backdrop-filter: blur(8px); }
  button:hover, button:focus-visible { border-color: var(--brass); outline: none; }
  button[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  .tag { position: fixed; transform: translate(-50%, -100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s; }
  .tag.on { opacity: 1; }
  #fx { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; font-weight: 700; font-size: 20px; letter-spacing: .1em; color: #fff; text-shadow: 0 0 12px var(--alarm); opacity: 0; }
  #fx.on { animation: alarm .5s steps(2) 6; }
  @keyframes alarm { 0% { opacity: 1; background: rgba(255,30,20,.22); } 100% { opacity: .2; background: transparent; } }
  @media (prefers-reduced-motion: reduce) { #fx.on { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="load">Blender で作った館内を読み込み中…</div>
<div class="top"><div class="title"><b>赤外線センサーが張られた夜の美術館</b><span>Blender で月明かりと照明を焼き込み済み・懐中電灯で照らして進む・赤い光線に触れると警報</span></div><div id="hud">警報 0 回</div></div>
<div id="tags"></div>
<div id="fx" role="status"></div>
<div class="btns">
  <button id="prev">◀ 前の作品</button><button id="home">入口へ</button><button id="next">次の作品 ▶</button>
  <button id="torch" aria-pressed="true">懐中電灯</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(async () => {
  // 読み込み元:埋め込み(window.WORLD_FILES)があればそれ、無ければ同じフォルダのファイル
  const FILES = window.WORLD_FILES || {};
  const src = (name) => FILES[name] || name;
  const info = FILES["heist.json"] ? JSON.parse(atob(FILES["heist.json"].split(",")[1])) : await (await fetch("heist.json")).json();

  const stage = document.getElementById("stage");
  const r = new THREE.WebGLRenderer({ antialias: true });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.outputEncoding = THREE.sRGBEncoding;
  r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(r.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x020203);
  scene.fog = new THREE.FogExp2(0x05060a, 0.018);
  const cam = new THREE.PerspectiveCamera(62, 1, 0.05, 120); scene.add(cam);
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const { R, H, RI, DOME, OCU } = info;
  const START = info.start;
  const S = { pos: V(START.x, 1.6, START.z), yaw: START.yaw, pitch: START.pitch, tween: null, cur: -1 };
  const items = [], beams = [], seg = [];
  let floorMesh = null;

  // ---- 光(焼き込みに足す動く光) ----
  scene.add(new THREE.HemisphereLight(0x2a3248, 0x050506, 0.12));
  const torch = new THREE.SpotLight(0xfff1d6, 6, 26, 0.38, 0.55, 1.2); torch.position.set(0.25, -0.25, 0); torch.target.position.set(0, -0.35, -5);
  cam.add(torch, torch.target);
  const alarmL = new THREE.PointLight(0xff1a1a, 0, R * 2.4, 1.2); alarmL.position.set(0, H - 1, 0); scene.add(alarmL);

  // ---- 光るもの ----
  const glowTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.3, "rgba(255,255,255,.4)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
  const ADD = { transparent: true, blending: THREE.AdditiveBlending, depthWrite: false };
  const glow = (color, size, op = 1) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, opacity: op, ...ADD })); s.scale.set(size, size, 1); return s; };
  const red = new THREE.MeshBasicMaterial({ color: 0xff2a2a, fog: false }), redGlow = new THREE.MeshBasicMaterial({ color: 0xff1a1a, opacity: 0.2, fog: false, ...ADD });
  function rod(a, b, radius, mat, segs = 6) { const d = b.clone().sub(a), len = d.length(), m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, segs, 1, true), mat); m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize()); return m; }
  function beam(a, b) { const o = new THREE.Group(); o.add(rod(a, b, 0.006, red, 4), rod(a, b, 0.035, redGlow, 8)); for (const p of [a, b]) { const s = glow(0xff3030, 0.22, 0.9); s.position.copy(p); o.add(s); } scene.add(o); beams.push(o); seg.push([a, b]); }

  // ---- 作品(サンプルのデータキューブ・金の色) ----
  const unit = new THREE.BoxGeometry(1, 1, 1);
  function dataCube(seed, [nx, ny, nz]) {
    const g = new THREE.Group(), s = 0.13, gap = 0.025, N = nx * ny * nz;
    let a = seed * 9301 + 49297; const rnd = () => ((a = (a * 9301 + 49297) % 233280) / 233280);
    const im = new THREE.InstancedMesh(unit, new THREE.MeshStandardMaterial({ roughness: 0.25, metalness: 0.6 }), N);
    const lo = new THREE.Color("#3a2a10"), hi = new THREE.Color("#ffd88a"), c = new THREE.Color(), m = new THREE.Matrix4();
    let k = 0;
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) for (let l = 0; l < nz; l++) {
      const t = Math.min(1, Math.max(0, 0.15 + 0.6 * rnd() + 0.25 * (j / ny)));
      m.makeScale(s - gap, s - gap, s - gap).setPosition((i - (nx - 1) / 2) * s, (j - (ny - 1) / 2) * s, (l - (nz - 1) / 2) * s);
      im.setMatrixAt(k, m); im.setColorAt(k++, c.copy(lo).lerp(hi, t));
    }
    im.castShadow = true; g.add(im); g.userData.h = ny * s; return g;
  }
  const SHAPES = [[5, 5, 4], [4, 7, 3], [6, 4, 4], [4, 6, 5]], NAMES = ["入金キューブ", "売上 × 月 × 店舗", "法人別の内訳", "申込者の推移"];

  // ---- 建物 ----
  const tl = new THREE.TextureLoader();
  const loadTex = (name) => new Promise((ok, ng) => tl.load(src(name), ok, undefined, ng));
  const gltf = await new Promise((ok, ng) => new THREE.GLTFLoader().load(src("heist.glb"), ok, undefined, ng));
  const root = gltf.scene; scene.add(root);
  const lights = {};
  // 焼いた光は赤い非常灯の色が強く出るので、色みを半分ほど抜いてから使う
  const calmLight = (img, keep = 0.25) => {
    const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0); const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) { const l = 0.3 * p[i] + 0.55 * p[i + 1] + 0.15 * p[i + 2]; p[i] = l + (p[i] - l) * keep; p[i + 1] = l + (p[i + 1] - l) * keep; p[i + 2] = l + (p[i + 2] - l) * keep; }
    x.putImageData(d, 0, 0); return c;
  };
  for (const [name, g] of Object.entries(info.groups)) { const t = await loadTex(g.light), c = new THREE.CanvasTexture(calmLight(t.image)); c.flipY = false; c.encoding = THREE.sRGBEncoding; lights[name] = c; }
  root.traverse((o) => {
    if (!o.isMesh) return;
    const name = o.name.replace(/_\d+$/, ""), g = info.groups[name] || info.groups[o.parent?.name];
    const key = info.groups[name] ? name : o.parent?.name;
    if (g) {
      o.geometry.setAttribute("uv2", o.geometry.attributes.uv);
      o.material = new THREE.MeshStandardMaterial({ map: o.material.map, lightMap: lights[key], lightMapIntensity: g.lightScale, roughness: g.rough, metalness: g.metal });
      o.receiveShadow = true;
      if (key === "floor") floorMesh = o;
    } else { // 光る物(非常灯・非常口)
      const c = o.material.emissive ? o.material.emissive.clone() : new THREE.Color(1, 1, 1);
      o.material = new THREE.MeshBasicMaterial({ color: c.multiplyScalar(2), toneMapped: false, fog: false });
    }
  });

  // 床:鏡を下に置き、大理石を少し透かす(濡れたような照り)
  const mir = new THREE.Reflector(new THREE.CircleGeometry(R, 72), { textureWidth: 1024, textureHeight: 1024, color: 0x6a6a6a });
  mir.rotation.x = -Math.PI / 2; mir.position.y = -0.004; scene.add(mir);
  Object.assign(floorMesh.material, { transparent: true, opacity: 0.78 });

  // 月の光の柱と、天窓の月
  const col = new THREE.Mesh(new THREE.CylinderGeometry(OCU, OCU * 1.5, H + DOME, 36, 1, true), new THREE.MeshBasicMaterial({ color: 0x8fb0ff, opacity: 0.045, side: THREE.DoubleSide, fog: false, ...ADD }));
  col.position.set(0.5, (H + DOME) / 2, -0.4); col.rotation.z = -0.1; col.rotation.x = -0.08; scene.add(col);
  const moon = glow(0xbcd2ff, 3.2, 0.9); moon.position.set(0.6, H + DOME + 1.6, -0.5); moon.material.fog = false; scene.add(moon);

  // 台座・ガラスケース・作品・台座を囲む光線
  const glassM = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.02, metalness: 0, transparent: true, opacity: 0.1, depthWrite: false });
  const edgeM = new THREE.LineBasicMaterial({ color: 0x9a9aa2, transparent: true, opacity: 0.55 });
  info.spots.forEach((d, i) => {
    const a = -d.face, c = Math.cos(-a), s = Math.sin(-a);
    const glass = new THREE.Mesh(new THREE.BoxGeometry(1.22, 1.32, 1.22), glassM); glass.position.set(d.x, 1.75, d.z); glass.rotation.y = -a; scene.add(glass);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(glass.geometry), edgeM); edges.position.copy(glass.position); edges.rotation.copy(glass.rotation); scene.add(edges);
    const model = dataCube(i + 1, SHAPES[i % 4]); model.scale.setScalar(0.78); model.position.set(d.x, d.y + model.userData.h * 0.78 / 2 + 0.08, d.z); model.rotation.y = -a; scene.add(model);
    const sp = new THREE.SpotLight(0xffe2b0, 4, 10, 0.2, 0.5, 1.4); sp.position.set(d.x * 0.82, H - 0.3, d.z * 0.82); sp.target.position.set(d.x, 1.4, d.z); sp.castShadow = true; sp.shadow.mapSize.set(512, 512); scene.add(sp, sp.target);
    const sq = [[-0.95, -0.95], [0.95, -0.95], [0.95, 0.95], [-0.95, 0.95]].map(([u, v]) => V(d.x + u * c + v * s, 0.2, d.z - u * s + v * c));
    for (let q = 0; q < 4; q++) beam(sq[q], sq[(q + 1) % 4]);
    const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = `${String(i + 1).padStart(2, "0")}  ${NAMES[i % 4]}`; document.getElementById("tags").appendChild(tag);
    items.push({ d, model, tag, hit: [glass, model] });
  });
  // 作品の間に張った光線(外周から中ほどまで)
  const angs = info.spots.map((d) => -d.face), n = angs.length;
  const gaps = [...angs.slice(0, -1).map((a, i) => (a + angs[i + 1]) / 2), angs[0] - 0.32, angs[n - 1] + 0.32];
  for (const a of gaps) for (const y of [0.45, 1.05]) beam(V(Math.sin(a) * (RI + 1.2), y, -Math.cos(a) * (RI + 1.2)), V(Math.sin(a) * (R - 0.2), y, -Math.cos(a) * (R - 0.2)));
  // 中央を回る光線
  const fan = new THREE.Group(); scene.add(fan);
  for (const [y, o] of [[0.5, 0], [0.9, 2.1], [1.2, 4.2]]) { const f = new THREE.Group(); f.rotation.y = o; f.add(rod(V(0, y, 0), V(RI, y, 0), 0.006, red, 4), rod(V(0, y, 0), V(RI, y, 0), 0.03, redGlow, 8)); fan.add(f); }
  const core = glow(0xff2020, 0.6, 0.9); core.position.set(0, 1.3, 0); scene.add(core);
  // 監視カメラ(首を振る)
  const camM = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.4 }), darkM = new THREE.MeshStandardMaterial({ color: 0x0c0c0e, roughness: 0.3 });
  const cams = info.cams.map((c, k) => {
    const cg = new THREE.Group(); cg.position.set(c.x, c.y, c.z); cg.rotation.y = c.base; scene.add(cg);
    const head = new THREE.Group(); head.add(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.2, 0.5), camM));
    const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.06, 16), darkM); lens.rotation.x = Math.PI / 2; lens.position.z = -0.27; head.add(lens);
    const led = glow(0xff2020, 0.25, 1); led.position.set(0.08, 0.08, -0.26); head.add(led); head.rotation.x = -0.45; cg.add(head);
    return { cg, base: c.base, led, ph: k * 1.7 };
  });
  // 宙を舞うほこり(月の光の中で光る)
  const dustN = 900, dp = new Float32Array(dustN * 3);
  for (let i = 0; i < dustN; i++) { const a = Math.random() * 6.3, d = Math.sqrt(Math.random()) * R; dp.set([Math.sin(a) * d, Math.random() * H, Math.cos(a) * d], i * 3); }
  const dg = new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.BufferAttribute(dp, 3));
  const dust = new THREE.Points(dg, new THREE.PointsMaterial({ size: 0.03, color: 0xbfc8d8, opacity: 0.5, map: glowTex, ...ADD })); scene.add(dust);

  // 金属が映す周りの景色(建物を一度だけ写す)
  const cube = new THREE.CubeCamera(0.1, 60, new THREE.WebGLCubeRenderTarget(256, { encoding: THREE.sRGBEncoding, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter }));
  cube.position.set(0, 2, 0); scene.add(cube); cube.update(r, scene);
  const pm = new THREE.PMREMGenerator(r), env = pm.fromCubemap(cube.renderTarget.texture).texture;
  // 映り込みは金属(真鍮・作品)だけに。壁や床に付けると焼き込んだ光に二重に足される
  scene.traverse((o) => { if (o.isMesh && o.material.isMeshStandardMaterial && o.material.metalness >= 0.5) { o.material.envMap = env; o.material.needsUpdate = true; } });
  document.getElementById("load").remove();

  // ---- 警報 ----
  let alarmT = 0, count = 0;
  const hud = document.getElementById("hud"), fx = document.getElementById("fx");
  function alarm() { alarmT = 3; count++; hud.textContent = `警報 ${count} 回`; fx.textContent = "警報 ── センサーに触れました"; fx.className = ""; void fx.offsetWidth; fx.className = "on"; }
  const cross = (a, b, p, q) => { const d = (b.x - a.x) * (q.z - p.z) - (b.z - a.z) * (q.x - p.x); if (Math.abs(d) < 1e-9) return false; const t = ((p.x - a.x) * (q.z - p.z) - (p.z - a.z) * (q.x - p.x)) / d, u = ((p.x - a.x) * (b.z - a.z) - (p.z - a.z) * (b.x - a.x)) / d; return t >= 0 && t <= 1 && u >= 0 && u <= 1; };
  function moved(a, b) {
    if (alarmT > 0) return;
    const ra = Math.hypot(a.x, a.z), rb = Math.hypot(b.x, b.z);
    if (ra >= RI + 0.1 && rb < RI + 0.1) return alarm();
    if (seg.some(([p, q]) => cross(a, b, p, q))) alarm();
  }

  // ---- 歩く ----
  const clamp = (p) => { const d = Math.hypot(p.x, p.z), m = R - 0.7; if (d > m) { p.x *= m / d; p.z *= m / d; } for (const q of items) { const dx = p.x - q.d.x, dz = p.z - q.d.z, dd = Math.hypot(dx, dz); if (dd < 1.4) { p.x = q.d.x + dx / (dd || 1) * 1.4; p.z = q.d.z + dz / (dd || 1) * 1.4; } } return p; };
  function go(pos, yaw, pitch, dur = 1.4) { S.tween = { a: S.pos.clone(), b: pos, ya: S.yaw, yb: S.yaw + ((yaw - S.yaw + Math.PI * 3) % (Math.PI * 2) - Math.PI), pa: S.pitch, pb: pitch, t: 0, dur, quiet: true }; }
  function goItem(i) { // 作品へは飛んで行く(光線は越えても警報にしない)
    S.cur = (i + items.length) % items.length; const d = items[S.cur].d, a = -d.face, back = V(Math.sin(a), 0, -Math.cos(a));
    go(clamp(V(d.x - back.x * d.dist, 1.6, d.z - back.z * d.dist)), d.face, -0.15);
  }
  document.getElementById("next").onclick = () => goItem(S.cur + 1);
  document.getElementById("prev").onclick = () => goItem(S.cur - 1);
  document.getElementById("home").onclick = () => { S.cur = -1; go(V(START.x, 1.6, START.z), START.yaw, START.pitch); };
  const tb = document.getElementById("torch");
  tb.onclick = () => { const on = tb.getAttribute("aria-pressed") !== "true"; tb.setAttribute("aria-pressed", on); torch.visible = on; };
  let drag = null;
  r.domElement.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, yaw: S.yaw, pitch: S.pitch, moved: 0 }; r.domElement.setPointerCapture(e.pointerId); });
  r.domElement.addEventListener("pointermove", (e) => {
    if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
    S.yaw = drag.yaw + dx * 0.004; S.pitch = Math.max(-1.2, Math.min(1.2, drag.pitch + dy * 0.004)); if (S.tween) S.tween = null;
  });
  r.domElement.addEventListener("pointerup", (e) => {
    const d = drag; drag = null; if (!d || d.moved > 6) return;
    const rect = r.domElement.getBoundingClientRect(), ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1), cam);
    const hitItem = items.findIndex((q) => ray.intersectObjects(q.hit, true).length);
    if (hitItem >= 0) return goItem(hitItem);
    const h = ray.intersectObject(floorMesh)[0];
    if (h) { const p = clamp(V(h.point.x, 1.6, h.point.z)); go(p, S.yaw, S.pitch, Math.min(2.4, 0.6 + p.distanceTo(S.pos) / 4)); S.tween.quiet = false; }
  });
  const keys = {}; addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true); addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

  // ---- 描く ----
  function size() { const w = stage.clientWidth, h = stage.clientHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  addEventListener("resize", size); size();
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let last = performance.now(), T = 0;
  const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  (function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
    const before = S.pos.clone();
    const f = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0), sd = (keys.d ? 1 : 0) - (keys.a ? 1 : 0), turn = (keys.arrowright ? 1 : 0) - (keys.arrowleft ? 1 : 0);
    let walking = false;

    for (const q of items) {
      const p = V(q.d.x, 2.6, q.d.z).project(cam), near = S.pos.distanceTo(q.model.position) < 5;
      q.tag.classList.toggle("on", near && p.z < 1);
      q.tag.style.left = (p.x + 1) / 2 * stage.clientWidth + "px"; q.tag.style.top = (1 - p.y) / 2 * stage.clientHeight + "px";
    }

  })(last);
})().catch((e) => { const l = document.getElementById("load"); if (l) l.textContent = "読み込めませんでした: " + (e.message || e); console.error(e); });
