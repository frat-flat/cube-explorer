<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>展示の世界 Blender版</title>
<style>
  /* 画面いっぱいの 3D に、すりガラスの札とボタンを重ねる */
  :root { --bg: #0b0d10; --ink: #eef0f2; --muted: #a3acb5; --panel: rgba(14,16,20,.68); --line: rgba(255,255,255,.16); --accent: #e0b866; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 "Noto Sans JP", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .top { position: fixed; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 12px; pointer-events: none; }
  .title { background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
  .title b { display: block; font-size: 15px; }
  .title span { color: var(--muted); font-size: 12px; }
  .btns { position: fixed; right: 16px; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  #pick { pointer-events: auto; margin-left: auto; align-self: flex-start; font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 45vw; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; backdrop-filter: blur(8px); }
  button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; padding: 0 16px; text-align: center; }
  .tag { position: fixed; transform: translate(-50%, -100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s; }
  .tag.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="load">Blender で作った世界を読み込み中…</div>
<div class="top"><div class="title"><b id="name">展示の世界</b><span id="tip">光と影は Blender で焼き込み済み・ドラッグで見回す・床をタップで移動</span></div></div>
<div id="tags"></div>
<div class="btns"><button id="prev">◀ 前の作品</button><button id="home">入口へ</button><button id="next">次の作品 ▶</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
<script src="blender-world.js"></script>
<script>
/* Blender で焼いた世界を歩くページ(どの世界でも共通)。
   読み込むもの: <w>.json(tools/blender/worldkit.py が書く)・<w>.glb・<w>_<組>_light.jpg
   json の主な項目: groups(組ごとの光の画像・倍率・ざらつき・unlit・opacity)/ spots(作品の場所)/ start / walk / fly /
   bg / fog / exposure / hemi / sun / reflect / palette / title / tip */
(async () => {
  // 公開ページ(WORLD_LIST あり)では、世界ごとのデータを <w>.data.js(GLB と json を埋め込んだスクリプト)で読む
  const LIST = window.WORLD_LIST || null;
  const W = window.WORLD_NAME || location.hash.slice(1) || new URLSearchParams(location.search).get("w") || (LIST ? LIST[0].id : "rpg");
  if (LIST) {
    const sel = document.createElement("select"); sel.id = "pick"; sel.setAttribute("aria-label", "世界を選ぶ");
    sel.innerHTML = LIST.map((w) => `<option value="${w.id}"${w.id === W ? " selected" : ""}>${w.title}</option>`).join("");
    sel.onchange = () => { location.hash = sel.value; location.reload(); };
    document.querySelector(".top").appendChild(sel);
    const load = (u) => new Promise((ok, ng) => { const sc = document.createElement("script"); sc.src = u; sc.onload = ok; sc.onerror = () => ng(new Error(u)); document.head.appendChild(sc); });
    await load(`${W}.data.js`);
    // 1 ファイル 16MB までなので、大きい GLB は <w>.data1.js, data2.js … に分けて後ろへつなぐ
    for (let i = 1; i <= (window.WORLD_FILES.more || 0); i++) await load(`${W}.data${i}.js`);
  }
  const FILES = window.WORLD_FILES || {};
  const info = FILES[`${W}.json`] ? JSON.parse(decodeURIComponent(escape(atob(FILES[`${W}.json`].split(",")[1])))) : await (await fetch(`${W}.json`)).json();
  if (info.title) { document.getElementById("name").textContent = info.title; document.title = `${info.title} Blender版`; }
  if (info.tip) document.getElementById("tip").textContent = info.tip;

  const stage = document.getElementById("stage");
  const r = new THREE.WebGLRenderer({ antialias: true });
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.outputEncoding = THREE.sRGBEncoding;
  r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = info.exposure || 1;
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(r.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(info.bg || "#0b0d10");
  if (info.fog) scene.fog = new THREE.FogExp2(info.fog[0], info.fog[1]);
  const cam = new THREE.PerspectiveCamera(62, 1, 0.05, info.far || 400); scene.add(cam);
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const EYE = info.eye || 1.6, START = info.start || { x: 0, z: 0, yaw: 0, pitch: 0 };
  const S = { pos: V(START.x, START.y ?? EYE, START.z), yaw: START.yaw || 0, pitch: START.pitch || 0, tween: null, cur: -1 };
  const items = [];

  // ---- 動く光(作品を照らし、影を落とす) ----
  const hemi = info.hemi || ["#ffffff", "#555555", 0.5];
  scene.add(new THREE.HemisphereLight(hemi[0], hemi[1], hemi[2]));
  if (info.sun) {
    const s = new THREE.DirectionalLight(info.sun.color || "#ffffff", info.sun.intensity ?? 1.5), d = info.sun.dir || [3, 8, 4];
    s.position.set(d[0] * 10, d[1] * 10, d[2] * 10); s.castShadow = true; s.shadow.mapSize.set(2048, 2048);
    const B = info.sun.box || 30; Object.assign(s.shadow.camera, { left: -B, right: B, top: B, bottom: -B, near: 1, far: 400 }); s.shadow.bias = -0.0004;
    scene.add(s, s.target);
  }

  // ---- 作品(サンプルのデータキューブ) ----
  const unit = new THREE.BoxGeometry(1, 1, 1), PAL = info.palette || ["#d9eeef", "#0e6a70"];
  function dataCube(seed, [nx, ny, nz]) {
    const g = new THREE.Group(), s = 0.16, gap = 0.03, N = nx * ny * nz;
    let a = seed * 9301 + 49297; const rnd = () => ((a = (a * 9301 + 49297) % 233280) / 233280);
    const im = new THREE.InstancedMesh(unit, new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.1, emissive: info.glowCubes ? 0xffffff : 0x000000, emissiveIntensity: info.glowCubes ? 0.25 : 0 }), N);
    const lo = new THREE.Color(PAL[0]), hi = new THREE.Color(PAL[1]), c = new THREE.Color(), m = new THREE.Matrix4();
    let k = 0;
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) for (let l = 0; l < nz; l++) {
      const t = Math.min(1, Math.max(0, 0.15 + 0.6 * rnd() + 0.25 * (j / ny)));
      m.makeScale(s - gap, s - gap, s - gap).setPosition((i - (nx - 1) / 2) * s, (j - (ny - 1) / 2) * s, (l - (nz - 1) / 2) * s);
      im.setMatrixAt(k, m); im.setColorAt(k++, c.copy(lo).lerp(hi, t));
    }
    im.castShadow = true; g.add(im);
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(nx * s, ny * s, nz * s)), new THREE.LineBasicMaterial({ color: 0x1b2428, transparent: true, opacity: 0.45 })));
    g.userData.h = ny * s; return g;
  }
  const SHAPES = [[6, 5, 4], [5, 7, 3], [8, 4, 4], [4, 6, 6]], NAMES = ["入金キューブ", "売上 × 月 × 店舗", "法人別の内訳", "申込者の推移"];

  // ---- 読み込み(blender-world.js) ----
  const { root } = await BlenderWorld.load(W, { files: FILES, info });
  scene.add(root);
  const ground = []; root.traverse((o) => { if (o.isMesh && (o.material.lightMap || o.material.isMeshStandardMaterial)) ground.push(o); }); // 床をタップして進む先
  const mir = BlenderWorld.mirror(info); if (mir) { scene.add(mir); BlenderWorld.glossFloor(info, root); }
  // 影を受けるだけの面(作品の影を地面に)。奥行きを書かず最後に描く(半透明の床が見る向きによって消えないように)
  const shadowY = info.shadowY ?? 0;
  if (!info.fly) { const sh = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.25, depthWrite: false })); sh.renderOrder = 1; sh.rotation.x = -Math.PI / 2; sh.position.y = shadowY + 0.003; sh.receiveShadow = true; scene.add(sh); }
  // 金属の映り込み(建物を一度だけ写す)
  scene.environment = BlenderWorld.env(r, scene, START.x, EYE + 0.5, START.z).texture;

  // 作品を置く
  info.spots.forEach((d, i) => {
    const model = dataCube(i + 1, SHAPES[i % 4]), sc = d.scale || 1; model.scale.setScalar(sc);
    model.position.set(d.x, d.center ? d.y : d.y + model.userData.h * sc / 2 + (d.lift ?? 0.12), d.z); model.rotation.y = (d.face || 0) + 0.4; scene.add(model);
    if (!info.sun) { const sp = new THREE.SpotLight(info.spotColor || 0xfff0dc, info.spotIntensity ?? 1.6, 14, 0.45, 0.6, 1.2); sp.position.set(d.x, d.y + 5, d.z + 0.5); sp.target.position.set(d.x, d.y, d.z); sp.castShadow = true; sp.shadow.mapSize.set(512, 512); scene.add(sp, sp.target); }
    const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = `${String(i + 1).padStart(2, "0")}  ${NAMES[i % 4]}`; document.getElementById("tags").appendChild(tag);
    items.push({ d, model, tag, sc });
  });
  document.getElementById("load").remove();

  // ---- 歩く・飛ぶ ----
  const walk = info.walk || [];
  const inside = (p) => walk.some((s) => s.t === "circ" ? Math.hypot(p.x - (s.x || 0), p.z - (s.z || 0)) <= s.r : p.x >= s.x0 && p.x <= s.x1 && p.z >= s.z0 && p.z <= s.z1);
  function clamp(p, from) {
    if (info.fly) { const lim = info.limit || 60; p.x = Math.max(-lim, Math.min(lim, p.x)); p.z = Math.max(-lim, Math.min(lim, p.z)); p.y = Math.max(info.minY ?? 0.6, Math.min(info.maxY ?? 30, p.y)); }
    else if (walk.length && !inside(p)) { if (from && inside(V(p.x, 0, from.z))) p.z = from.z; else if (from && inside(V(from.x, 0, p.z))) p.x = from.x; else if (from) { p.x = from.x; p.z = from.z; } }
    for (const q of items) { const dx = p.x - q.d.x, dz = p.z - q.d.z, dd = Math.hypot(dx, dz), rr = q.d.r || 1.1; if (!info.fly && dd < rr) { p.x = q.d.x + dx / (dd || 1) * rr; p.z = q.d.z + dz / (dd || 1) * rr; } }
    return p;
  }
  function go(pos, yaw, pitch, dur = 1.4) { S.tween = { a: S.pos.clone(), b: pos, ya: S.yaw, yb: S.yaw + ((yaw - S.yaw + Math.PI * 3) % (Math.PI * 2) - Math.PI), pa: S.pitch, pb: pitch, t: 0, dur }; }
  function goItem(i) {
    S.cur = (i + items.length) % items.length; const q = items[S.cur], d = q.d, dist = (d.dist || 3.5) * Math.max(1, q.sc), yaw = d.face || 0;
    const cy = info.fly ? q.model.position.y : (d.eyeY ?? EYE);
    go(V(d.x + Math.sin(yaw) * dist, cy, d.z + Math.cos(yaw) * dist), yaw, info.fly ? 0 : Math.atan2(q.model.position.y - cy, dist) * 0.8);
  }
  document.getElementById("next").onclick = () => goItem(S.cur + 1);
  document.getElementById("prev").onclick = () => goItem(S.cur - 1);
  document.getElementById("home").onclick = () => { S.cur = -1; go(V(START.x, START.y ?? EYE, START.z), START.yaw || 0, START.pitch || 0); };
  let drag = null;
  r.domElement.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, yaw: S.yaw, pitch: S.pitch, moved: 0 }; r.domElement.setPointerCapture(e.pointerId); });
  r.domElement.addEventListener("pointermove", (e) => {
    if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
    S.yaw = drag.yaw + dx * 0.004; S.pitch = Math.max(-1.3, Math.min(1.3, drag.pitch + dy * 0.004)); S.tween = null;
  });
  r.domElement.addEventListener("pointerup", (e) => {
    const d = drag; drag = null; if (!d || d.moved > 6) return;
    const rect = r.domElement.getBoundingClientRect(), ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1), cam);
    const hitItem = items.findIndex((q) => ray.intersectObject(q.model, true).length);
    if (hitItem >= 0) return goItem(hitItem);
    if (info.fly) { const p = clamp(S.pos.clone().addScaledVector(ray.ray.direction, 8)); go(p, S.yaw, S.pitch, 1.4); return; }
    const h = ray.intersectObjects(ground, false).find((x) => x.face && x.face.normal.clone().transformDirection(x.object.matrixWorld).y > 0.6);
    if (h) { const p = V(h.point.x, EYE, h.point.z); if (!walk.length || inside(p)) go(clamp(p), S.yaw, S.pitch, Math.min(2.6, 0.6 + p.distanceTo(S.pos) / 5)); }
  });
  const keys = {}; addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true); addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

  // ---- 描く ----
  function size() { const w = stage.clientWidth, h = stage.clientHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  addEventListener("resize", size); size();
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let last = performance.now();
  const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  (function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const f = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0), sd = (keys.d ? 1 : 0) - (keys.a ? 1 : 0), turn = (keys.arrowright ? 1 : 0) - (keys.arrowleft ? 1 : 0);
    if (f || sd || turn) {
      S.tween = null; S.yaw -= turn * dt * 1.6; const from = S.pos.clone(), sp = (info.speed || 3) * dt;
      S.pos.x += (-Math.sin(S.yaw) * f + Math.cos(S.yaw) * sd) * sp; S.pos.z += (-Math.cos(S.yaw) * f - Math.sin(S.yaw) * sd) * sp;
      if (info.fly) S.pos.y += Math.sin(S.pitch) * f * sp;
      clamp(S.pos, from);
    }
    if (S.tween) { const T = S.tween; T.t = Math.min(1, T.t + dt / T.dur); const k = ease(T.t); S.pos.lerpVectors(T.a, T.b, k); S.yaw = T.ya + (T.yb - T.ya) * k; S.pitch = T.pa + (T.pb - T.pa) * k; if (T.t >= 1) S.tween = null; }
    cam.position.copy(S.pos); cam.rotation.set(S.pitch, S.yaw, 0, "YXZ");
    for (const q of items) {
      if (!calm) q.model.rotation.y += dt * 0.12;
      const p = V(q.model.position.x, q.model.position.y + q.model.userData.h * q.sc / 2 + 0.4, q.model.position.z).project(cam), near = S.pos.distanceTo(q.model.position) < 6 * Math.max(1, q.sc);
      q.tag.classList.toggle("on", near && p.z < 1);
      q.tag.style.left = (p.x + 1) / 2 * stage.clientWidth + "px"; q.tag.style.top = (1 - p.y) / 2 * stage.clientHeight + "px";
    }
    r.render(scene, cam); requestAnimationFrame(loop);
  })(last);
})().catch((e) => { const l = document.getElementById("load"); if (l) l.textContent = "読み込めませんでした: " + (e.message || e); console.error(e); });
</script>
</body>
</html>
